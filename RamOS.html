<style>
  :root{
    --bg:#F2F2F2; --surface:#FFFFFF; --text:#24344A; --text-muted:#68788D;
    --primary:#5C86B0; --primary-ink:#FFFFFF; --secondary:#35597D; --accent-eval:#A9C4DE; --border:#E1E4E8;
    --danger:#B5453A;
    --font-display:'Poppins',sans-serif; --font-body:'Nunito Sans',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); overflow:hidden;}
  .app{position:relative; height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:480px; margin:0 auto; background:var(--bg);}

  .topbar{padding:calc(20px + env(safe-area-inset-top)) 18px 12px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .gear-btn{width:34px; height:34px; border-radius:50%; border:none; background:var(--bg); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;}
  .gear-btn svg{width:19px; height:19px; stroke:var(--text-muted); fill:none; stroke-width:1.8;}
  .topbar h1{font-family:var(--font-display); font-size:23px; font-weight:700; margin:0; display:flex; align-items:center;}
  .title-ramos{line-height:1;}
  .title-sep{display:inline-block; width:2px; height:18px; background:var(--text); margin:0 0 0 8px; flex-shrink:0;}
  .title-wrap{box-sizing:border-box; display:inline-block; overflow:hidden; width:44px; padding-left:8px; height:1em; line-height:1;}
  .title-section{display:inline-block; white-space:nowrap; color:var(--primary); line-height:1;}

  .screens{flex:1; overflow-y:auto; padding:0 18px 110px; -webkit-overflow-scrolling:touch; position:relative;}
  .screen{display:none;}
  .screen.active{display:block;}

  .empty-state{text-align:center; padding:40px 10px 10px; color:var(--text-muted);}
  .empty-state p{font-size:13.5px; line-height:1.5; margin:0 0 4px;}

  .add-frame{border:2px dashed #C7CDD4; border-radius:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; color:var(--primary); background:rgba(92,134,176,.04); transition:background .15s ease;}
  .add-frame:active{background:rgba(92,134,176,.10);}
  .add-frame.big{flex-direction:column; min-height:220px; margin-top:14px;}
  .add-frame.big .plus{font-size:34px; font-weight:300; line-height:1;}
  .add-frame.big .label{font-family:var(--font-display); font-size:15px; font-weight:600;}
  .add-frame.compact{padding:14px; margin-top:4px; margin-bottom:14px;}
  .add-frame.compact .plus{font-size:18px; margin-right:2px;}
  .add-frame.compact .label{font-family:var(--font-body); font-size:13px; font-weight:700;}

  .ramo-card{background:var(--surface); border-radius:18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(36,52,74,.08); overflow:hidden; cursor:pointer;}
  .ramo-card-header{padding:16px 16px 12px;}
  .ramo-card h3{font-family:var(--font-display); font-size:17px; font-weight:600; margin:0;}
  .ramo-card .codigo{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .ramo-row{display:flex; align-items:flex-start; gap:10px; padding:8px 16px;}
  .ramo-row-icon{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
  .ramo-row-icon svg{width:12px; height:12px; stroke-width:2; fill:none;}
  .ramo-row-text{font-size:12.5px; color:var(--text); line-height:1.4; padding-top:1px;}
  .ramo-card-actions{padding:6px 16px 14px;}
  .icon-btn{border:none; background:transparent; color:var(--text-muted); font-size:12.5px; font-family:var(--font-body); font-weight:700; cursor:pointer; padding:4px 0;}
  .icon-btn.danger{color:var(--danger);}

  .icon-info{background:rgba(53,89,125,.13);} .icon-info svg{stroke:var(--secondary);}
  .icon-horario{background:rgba(92,134,176,.15);} .icon-horario svg{stroke:var(--primary);}
  .icon-eval{background:rgba(169,196,222,.35);} .icon-eval svg{stroke:#5C86B0;}

  .fab{position:absolute; right:18px; bottom:88px; z-index:5;}

  .btn{font-family:var(--font-body); font-weight:700; font-size:14px; padding:12px 20px; cursor:pointer; border:2px solid var(--primary); border-radius:999px; box-shadow:0 3px 10px rgba(36,52,74,.16);}
  .btn-primary{background:var(--primary); color:var(--primary-ink);}
  .btn-secondary{background:transparent; color:var(--primary);}
  .btn-block{width:100%;}

  .bottom-nav{position:absolute; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--surface); border-top:1px solid var(--border); display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; color:var(--text-muted); padding:6px 0; font-family:var(--font-body);}
  .nav-item svg{width:22px; height:22px; stroke:var(--text-muted); fill:none; stroke-width:1.8;}
  .nav-icon-slot{height:26px; display:flex; align-items:center; justify-content:center;}
  .tiktok-badge{position:relative; width:30px; height:22px; flex-shrink:0;}
  .tiktok-badge-shadow{position:absolute; inset:0; border-radius:7px; background:var(--secondary); transform:translate(4px,-3px);}
  .tiktok-badge-core{position:absolute; inset:0; border-radius:7px; background:var(--primary); display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(36,52,74,.25);}
  .tiktok-badge-core svg{width:15px; height:15px; stroke:#fff; fill:none; stroke-width:2.4; stroke-linecap:round;}
  .nav-item span{font-size:10.5px; font-weight:700;}
  .nav-item.active{color:var(--primary);}
  .nav-item.active svg{stroke:var(--primary);}
  .nav-item-main.active .tiktok-badge-core svg{stroke:#fff;}

  .toast{position:absolute; top:14px; left:16px; right:16px; background:var(--text); color:#fff; padding:12px 14px; border-radius:12px; font-size:12.5px; line-height:1.4; z-index:40; opacity:0; transform:translateY(-8px); transition:all .2s ease; pointer-events:none;}
  .toast.show{opacity:1; transform:translateY(0);}

  .choice-backdrop{position:absolute; inset:0; background:rgba(20,28,38,.4); z-index:28; display:none; align-items:center; justify-content:center; padding:22px;}
  .choice-backdrop.active{display:flex;}
  .choice-card{background:var(--surface); border-radius:18px; padding:20px; max-width:340px; width:100%;}
  .choice-card h3{font-family:var(--font-display); font-size:16px; margin:0 0 4px;}
  .choice-card>p{font-size:12.5px; color:var(--text-muted); margin:0 0 14px;}
  .choice-btn{display:block; width:100%; text-align:left; background:var(--bg); border:1.5px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--text); cursor:pointer;}
  .choice-btn span{display:block; font-weight:400; font-size:11px; color:var(--text-muted); margin-top:2px;}
  .choice-cancel{display:block; width:100%; text-align:center; background:none; border:none; color:var(--text-muted); font-family:var(--font-body); font-weight:700; font-size:13px; padding:8px; cursor:pointer;}

  .modal-backdrop{position:absolute; inset:0; background:rgba(20,28,38,.4); z-index:19; display:none;}
  .modal-backdrop.active{display:block;}
  .modal-sheet{position:absolute; left:0; right:0; bottom:0; height:75vh; height:75dvh; background:var(--surface); border-radius:22px 22px 0 0; z-index:20; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .25s ease; max-width:480px; margin:0 auto; box-shadow:0 -8px 24px rgba(0,0,0,.18);}
  .modal-sheet.active{transform:translateY(0);}
  .modal-drag-zone{padding:9px 0 7px; display:flex; justify-content:center; cursor:grab; touch-action:none; flex-shrink:0;}
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:4px;}
  .modal-header{display:flex; align-items:center; justify-content:space-between; padding:10px 18px 0;}
  .modal-header h2{font-family:var(--font-display); font-size:18px; margin:0;}
  .close-x{background:none; border:none; font-size:20px; color:var(--text-muted); cursor:pointer; line-height:1;}

  .tab-switch{display:flex; gap:5px; padding:4px; background:var(--bg); border-radius:12px; margin:14px 18px;}
  .tab-switch button{flex:1; border:none; background:transparent; padding:9px 4px; border-radius:9px; font-family:var(--font-body); font-weight:700; font-size:11.5px; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .tab-switch button svg{width:15px; height:15px; stroke:var(--text-muted); fill:none; stroke-width:1.8;}
  .tab-switch button.active{background:var(--surface); color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .tab-switch button.active svg{stroke:var(--primary);}

  .modal-body{flex:1; overflow-y:auto; overflow-x:hidden; padding:4px 18px 30px; -webkit-overflow-scrolling:touch;}
  .modal-footer{padding:12px 18px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex-shrink:0;}

  .field-group{margin-bottom:12px;}
  .field-label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px; font-weight:700;}
  .field-row{display:flex; gap:8px;}
  .field-row .field-group{flex:1;}
  input[type=text], input[type=email], input[type=number], input[type=date], input[type=time], select{
    width:100%; font-family:var(--font-body); font-size:14px; padding:10px 11px; color:var(--text);
    background:var(--surface); border:1.5px solid var(--border); border-radius:8px; outline:none;
  }
  input:focus, select:focus{border-color:var(--primary);}
  .checkline{display:flex; align-items:center; gap:9px; padding:9px 0; cursor:pointer;}
  .checkline input{width:18px; height:18px; accent-color:var(--primary);}
  .checkline span{font-size:13.5px;}

  /* interruptor tipo píldora */
  .switch{position:relative; display:inline-block; width:38px; height:22px; flex-shrink:0;}
  .switch input{position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; -webkit-appearance:none; appearance:none; z-index:2;}
  .switch .track{position:absolute; inset:0; background:var(--border); border-radius:999px; transition:background .2s ease; pointer-events:none;}
  .switch .thumb{position:absolute; left:2px; top:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .2s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch input:checked + .track{background:var(--primary);}
  .switch input:checked + .track .thumb{transform:translateX(16px);}
  .switch.mini{width:30px; height:18px;}
  .switch.mini .thumb{width:14px; height:14px;}
  .switch.mini input:checked + .track .thumb{transform:translateX(12px);}
  .switch-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; cursor:pointer;}
  .switch-row .switch-text{font-size:13.5px;}
  .subcard{background:var(--bg); border-radius:12px; padding:12px; margin-bottom:10px;}
  .subcard-head{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px;}
  .subcard-head strong{font-size:13px;}
  .remove-x{background:none; border:none; color:var(--text-muted); font-size:12.5px; cursor:pointer; font-weight:700; flex-shrink:0;}
  .correo-input-row{display:flex; align-items:stretch; gap:6px;}
  .correo-input-row input{flex:1; min-width:0;}
  .correo-arrow-btn{flex-shrink:0; border:1.5px solid var(--border); background:var(--surface); color:var(--primary); font-size:16px; font-weight:700; line-height:1; padding:0 12px; border-radius:8px; cursor:pointer;}
  .add-link{background:none; border:1.5px dashed var(--border); border-radius:8px; color:var(--primary); font-family:var(--font-body); font-weight:700; font-size:13px; padding:10px; width:100%; cursor:pointer;}
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:8px; line-height:1.4;}

  /* tabla de evaluaciones */
  .eval-card .subcard-head{margin-bottom:10px;}
  .eval-card.discarded{opacity:.5;}
  .eval-card.discarded input{text-decoration:line-through;}

  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:4px 0 0; max-width:100%;}
  .eval-table{border-collapse:collapse; width:100%; min-width:544px; table-layout:fixed;}
  .eval-table th:nth-child(1), .eval-table td:nth-child(1){width:110px;}
  .eval-table th:nth-child(2), .eval-table td:nth-child(2){width:58px;}
  .eval-table th:nth-child(3), .eval-table td:nth-child(3){width:48px;}
  .eval-table th:nth-child(4), .eval-table td:nth-child(4){width:112px;}
  .eval-table th:nth-child(5), .eval-table td:nth-child(5){width:102px;}
  .eval-table th:nth-child(6), .eval-table td:nth-child(6){width:66px;}
  .eval-table th:nth-child(7), .eval-table td:nth-child(7){width:28px;}
  .eval-table th{font-family:var(--font-body); font-weight:800; font-size:10px; color:var(--text-muted); text-align:left; padding:6px 4px; border-bottom:1.5px solid var(--border); white-space:nowrap;}
  .eval-table td{padding:4px 3px; border-bottom:1px solid var(--border); vertical-align:middle; overflow:hidden;}
  .eval-table input{width:100%; font-family:var(--font-body); font-size:12.5px; padding:7px 5px; border:1.5px solid var(--border); border-radius:7px; color:var(--text); background:var(--surface); box-sizing:border-box;}
  .eval-table .rm-row{background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; padding:0 4px;}
  .discarded-row{opacity:.5;}
  .discarded-row input{text-decoration:line-through;}

  /* picker de fecha/hora dentro de la tabla */
  .picker-field-sm{display:flex; align-items:center; gap:3px; background:var(--surface); border:1.5px solid var(--border); border-radius:7px; padding:7px 5px; cursor:pointer; box-sizing:border-box;}
  .picker-field-sm input{flex:1; border:none; outline:none; background:transparent; font-family:var(--font-body); font-size:10.5px; color:var(--text); padding:0; pointer-events:none; min-width:0;}
  .picker-field-sm input::placeholder{color:var(--text-muted);}
  .picker-field-sm svg{width:13px; height:13px; stroke:var(--text-muted); fill:none; stroke-width:1.8; flex-shrink:0;}

  /* tarjeta compartida por calendario y hora */
  .picker-card{background:var(--surface); border-radius:20px; padding:18px; width:100%; max-width:300px; box-shadow:0 12px 34px rgba(0,0,0,.22);}

  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .cal-header button{width:32px; height:32px; border-radius:50%; border:none; background:var(--bg); color:var(--primary); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .cal-month-label{font-family:var(--font-display); font-size:15px; font-weight:700; text-transform:capitalize;}
  .cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:6px;}
  .cal-weekdays span{text-align:center; font-size:10.5px; font-weight:700; color:var(--text-muted);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); height:236px;}
  .cal-day{display:flex; align-items:center; justify-content:center; border:none; background:none; font-family:var(--font-body); padding:0; cursor:pointer; width:100%; height:100%;}
  .cal-day-dot{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13.5px; color:var(--text);}
  .cal-day.other-month .cal-day-dot{color:var(--border);}
  .cal-day.other-month{pointer-events:none;}
  .cal-day.today .cal-day-dot{font-weight:800; color:var(--primary);}
  .cal-day.selected .cal-day-dot{background:var(--primary); color:var(--primary-ink); font-weight:700;}
  .cal-day:not(.other-month):not(.selected):active .cal-day-dot{background:var(--bg);}

  /* pantalla Inicio */
  .inicio-card{background:var(--surface); border-radius:18px; box-shadow:0 4px 16px rgba(36,52,74,.08); padding:18px; margin-bottom:14px; touch-action:pan-y;}
  .inicio-card-label{font-size:10.5px; font-weight:800; color:var(--text-muted); letter-spacing:.3px; margin-bottom:10px;}
  .clase-nombre{font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; text-align:center;}
  .clase-sala{font-family:var(--font-display); font-size:32px; font-weight:800; color:var(--primary); line-height:1.1; text-align:center;}
  .clase-bloque{font-size:12px; color:var(--text-muted); font-weight:700; margin-top:6px; text-align:center;}
  .eval-ramo{font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--text); text-align:center;}
  .eval-fecha{font-size:12.5px; color:var(--text-muted); margin-top:4px; text-transform:capitalize; text-align:center;}
  .eval-nombre-pct{font-size:14px; font-weight:700; color:var(--primary); margin-top:10px; text-align:center;}
  .eval-sala{font-size:12px; color:var(--text-muted); margin-top:4px; text-align:center;}

  .mini-cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px;}
  .mini-cal-weekdays span{text-align:center; font-size:9.5px; font-weight:700; color:var(--text-muted);}
  .mini-cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .mini-cal-day{display:flex; align-items:center; justify-content:center; height:32px; font-size:11.5px; color:var(--text); font-family:var(--font-body);}
  .mini-cal-day.other{color:transparent;}
  .mini-cal-marker{width:25px; height:25px; display:flex; align-items:center; justify-content:center; border-radius:8px; font-weight:700; color:#fff; font-size:11px; position:relative;}
  .mini-cal-marker.pasada{background:#35597D;}
  .mini-cal-marker.futura{background:#9DBAD8;}
  .mini-cal-marker.combo{width:29px; height:29px;}
  .mini-cal-today-dot{width:19px; height:19px; border-radius:50%; background:#20262A; color:#fff; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700;}
  .mini-cal-legend{display:flex; gap:14px; margin-top:12px; font-size:10.5px; color:var(--text-muted);}
  .mini-cal-legend .dot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:4px; vertical-align:middle;}
  .mini-cal-legend .dot.pasada{background:#35597D;}
  .mini-cal-legend .dot.futura{background:#9DBAD8; border-radius:3px;}
  .mini-cal-legend .dot.hoy{background:#20262A; border-radius:50%;}

  /* pantalla Calendario */
  .calvista-toggle{margin:0 0 16px;}
  .calvista-card{background:var(--surface); border-radius:18px; box-shadow:0 4px 16px rgba(36,52,74,.08); padding:18px; margin-bottom:14px;}
  .cal-day.clickable{cursor:pointer;}
  .calvista-detalle{margin-top:18px;}
  .calvista-detalle-card{background:var(--surface); border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:0 3px 12px rgba(36,52,74,.07);}
  .calvista-detalle-titulo{font-family:var(--font-display); font-size:14px; font-weight:700; margin-bottom:6px; color:var(--text);}
  .calendario-tabla{min-width:560px; table-layout:fixed;}
  .calendario-tabla th:nth-child(1), .calendario-tabla td:nth-child(1){width:26px;}
  .calendario-tabla th:nth-child(2), .calendario-tabla td:nth-child(2){width:104px;}
  .calendario-tabla th:nth-child(3), .calendario-tabla td:nth-child(3){width:96px;}
  .calendario-tabla th:nth-child(4), .calendario-tabla td:nth-child(4){width:78px;}
  .calendario-tabla th:nth-child(5), .calendario-tabla td:nth-child(5){width:60px;}
  .calendario-tabla th:nth-child(6), .calendario-tabla td:nth-child(6){width:48px;}
  .calendario-tabla th:nth-child(7), .calendario-tabla td:nth-child(7){width:42px;}
  .calendario-tabla th:nth-child(8), .calendario-tabla td:nth-child(8){width:66px;}
  .calendario-tabla td{padding:8px 5px; font-size:11.5px; color:var(--text); border-bottom:1px solid var(--border); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .calendario-tabla tbody tr{background:var(--surface);}
  .calendario-tabla tbody tr:nth-child(even){background:var(--bg);}

  /* pantalla Promedio */
  .promedio-card{background:var(--surface); border-radius:18px; box-shadow:0 4px 16px rgba(36,52,74,.08); margin-bottom:14px; overflow:hidden;}
  .promedio-header{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; cursor:pointer; gap:10px;}
  .promedio-nombre{font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--text);}
  .promedio-nombre .sub{display:block; font-size:11px; font-weight:600; color:var(--text-muted); margin-top:2px; transition:opacity .3s ease;}
  .promedio-card.expanded .promedio-nombre .sub{opacity:0;}
  .promedio-num-wrap{text-align:right; flex-shrink:0;}
  .promedio-num{font-family:var(--font-display); font-size:24px; font-weight:800;}
  .promedio-num.pasa{color:var(--primary);}
  .promedio-num.no-pasa{color:var(--danger);}
  .promedio-num-label{font-size:9.5px; color:var(--text-muted); font-weight:700;}

  .promedio-detail{display:grid; grid-template-rows:0fr; opacity:0; transform:translateX(-26px); transition:grid-template-rows .38s cubic-bezier(.4,0,.2,1), opacity .3s ease, transform .38s cubic-bezier(.4,0,.2,1);}
  .promedio-detail.expanded{grid-template-rows:1fr; opacity:1; transform:translateX(0);}
  .promedio-detail-inner{overflow:hidden; padding:0 18px 18px;}

  .promedio-grupo-label{font-family:var(--font-body); font-weight:800; font-size:10.5px; color:var(--text-muted); margin:12px 0 6px; padding-top:10px; border-top:1px dashed var(--border);}
  .promedio-grupo-label.sin-borde{border-top:none; padding-top:0; margin-top:0;}
  .promedio-grupo-label:first-child{border-top:none; padding-top:0; margin-top:0;}
  .promedio-eval-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px;}
  .promedio-eval-nombre{color:var(--text); flex:1;}
  .promedio-eval-nota{font-weight:700; color:var(--text); flex-shrink:0; margin-left:10px;}
  .promedio-eval-row.tachada .promedio-eval-nombre, .promedio-eval-row.tachada .promedio-eval-nota{text-decoration:line-through; color:var(--text-muted); opacity:.6;}
  .promedio-eval-row.cubierta .promedio-eval-nota{
    background:var(--bg); border:1px dashed var(--border); border-radius:6px; padding:2px 8px; font-size:10.5px; color:var(--text-muted); font-weight:700;
  }

  .promedio-stats{display:flex; gap:10px; margin-top:14px;}
  .promedio-stat{flex:1; background:var(--bg); border-radius:12px; padding:10px; text-align:center;}
  .promedio-stat-num{font-family:var(--font-display); font-size:17px; font-weight:800; color:var(--text);}
  .promedio-stat-label{font-size:9.5px; color:var(--text-muted); font-weight:700; margin-top:2px;}

  .promedio-resultado{margin-top:14px; padding:12px; border-radius:12px; text-align:center; font-family:var(--font-body); font-weight:700; font-size:13px;}
  .promedio-resultado.aprobado{background:rgba(92,134,176,.12); color:var(--primary);}
  .promedio-resultado.necesita{background:rgba(181,69,58,.1); color:var(--danger);}
  .promedio-resultado .num{font-family:var(--font-display); font-size:17px;}

  .wheel-wrap{position:relative; display:flex; justify-content:center; gap:2px; height:210px; margin-bottom:16px;}
  .wheel-col{height:210px; overflow-y:scroll; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; width:64px;}
  .wheel-col::-webkit-scrollbar{display:none;}
  .wheel-spacer{height:84px;}
  .wheel-item{height:42px; display:flex; align-items:center; justify-content:center; scroll-snap-align:center; font-family:var(--font-body); font-size:19px; font-weight:600; color:var(--text-muted); transition:color .15s ease, font-size .15s ease;}
  .wheel-item.centered{color:var(--text); font-size:21px; font-weight:800;}
  .wheel-ampm{width:52px;}
  .wheel-highlight{position:absolute; left:0; right:0; top:84px; height:42px; pointer-events:none; border-top:1.5px solid var(--border); border-bottom:1.5px solid var(--border);}
  .wheel-fade-top, .wheel-fade-bottom{position:absolute; left:0; right:0; height:70px; pointer-events:none; z-index:2;}
  .wheel-fade-top{top:0; background:linear-gradient(to bottom, var(--surface), rgba(255,255,255,0));}
  .wheel-fade-bottom{bottom:0; background:linear-gradient(to top, var(--surface), rgba(255,255,255,0));}
  #timeWheelView.collapsed{height:0; overflow:hidden; visibility:hidden;}
  .preset-table{width:100%; border-collapse:collapse; margin-bottom:14px;}
  .preset-table th{font-family:var(--font-body); font-weight:800; font-size:11px; color:var(--text-muted); text-align:left; padding:6px 4px; border-bottom:1.5px solid var(--border);}
  .preset-table td{padding:11px 4px; font-size:13.5px; color:var(--text); border-bottom:1px solid var(--border); cursor:pointer;}
  .preset-table tr:active td{background:var(--bg);}
  .preset-table tr:last-child td{color:var(--primary); font-weight:700;}
  .btn-confirm{width:100%; padding:12px; background:var(--primary); color:var(--primary-ink); border:none; border-radius:999px; font-family:var(--font-body); font-weight:700; font-size:14px; cursor:pointer;}

  /* grupos de evaluaciones */
  .eval-actions-row{display:flex; gap:8px; margin-top:12px;}
  .grupos-divider{height:1px; background:var(--border); margin:14px 0;}
  .eval-actions-row .add-link{flex:1; margin-top:0;}
  .grupo-block{border:1.5px dashed var(--border); border-radius:12px; padding:10px; margin-top:10px; cursor:pointer; overflow:hidden;}
  .grupo-block.active{border-color:var(--primary); border-style:solid; background:rgba(92,134,176,.05);}
  .grupo-head{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .grupo-title{font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--text-muted); outline:none; cursor:text; display:inline-block; min-width:44px; padding:3px 2px;}
  .grupo-title:empty:before{content:attr(data-placeholder);}
  .grupo-pond{display:flex; align-items:baseline; gap:2px; margin-left:auto;}
  .grupo-pond input{width:30px; text-align:right; font-family:var(--font-body); font-size:13px; padding:3px 1px; border:none; border-bottom:1.5px solid var(--border); border-radius:0; background:transparent; color:var(--text);}
  .grupo-pond input:focus{border-bottom-color:var(--primary);}
  .grupo-pond span{font-size:11px; color:var(--text-muted);}
  .mini-btn{border:1.5px solid var(--primary); background:transparent; color:var(--primary); font-family:var(--font-body); font-weight:700; font-size:10.5px; padding:6px 12px; border-radius:999px; cursor:pointer;}
  .pool-toggle-row{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px dashed var(--border);}
  .pool-toggle-label{font-family:var(--font-body); font-weight:700; font-size:11.5px; color:var(--text-muted);}
  .pool-toggle{display:inline-flex; align-items:center; gap:5px; padding:7px 14px; flex-shrink:0;}
  .lab-dividir-box{border:1.5px dashed var(--border); border-radius:12px; padding:10px 12px; margin-top:4px;}
  .pool-toggle svg{width:15px; height:15px; stroke:var(--primary); fill:none; stroke-width:1.8;}
  .pool-toggle span{font-family:var(--font-display); font-weight:800; font-size:13px;}
  .discarded-row{opacity:.5;}
  .discarded-row input{text-decoration:line-through;}

  /* horario semanal */
  .horario-empty{text-align:center; padding:60px 10px 10px; color:var(--text-muted);}
  .horario-empty p{font-size:13.5px; line-height:1.5;}
  .horario-grid{display:grid; gap:5px 4px; grid-auto-rows:62px;}
  .grid-head{display:contents;}
  .grid-head .cell{color:var(--text-muted); font-family:var(--font-body); font-weight:800; font-size:9.5px; text-align:center; padding:0 0 6px;}
  .slot{position:relative; height:100%;}
  .slot-fill{height:100%; border-radius:10px; display:flex; flex-direction:column; padding:2px 3px; overflow:hidden; cursor:pointer; border:none; width:100%; font-family:inherit;}
  .slot-nombre{position:relative; flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--font-body); font-weight:700; font-size:8.1px; line-height:1.1; color:#fff; overflow:hidden;}
  .slot-nombre::after{content:''; position:absolute; left:14%; right:14%; bottom:0; height:1px; background:rgba(255,255,255,.55);}
  .slot-sala{flex:1; display:flex; align-items:center; justify-content:center; text-align:center; font-family:var(--font-display); font-weight:700; font-size:11.5px; color:#fff;}
  .almuerzo-row{grid-column:1/-1; display:flex; align-items:center; gap:8px; padding:0 2px;}
  .almuerzo-line{flex:1; height:1px; background:var(--border);}
  .almuerzo-label{font-family:var(--font-body); font-weight:800; font-size:9px; color:var(--text-muted); white-space:nowrap;}
  .horario-legend{max-height:0; overflow:hidden; opacity:0; display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; transition:max-height .32s ease, opacity .25s ease;}
  .horario-legend.expanded{max-height:400px; opacity:1; margin-top:12px;}
  .horario-legend .legend-item{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--text-muted);}
  .legend-dot{width:10px; height:10px; border-radius:3px; flex-shrink:0;}
  .ramos-divider{display:flex; align-items:center; gap:8px; padding:2px; margin-top:32px; cursor:pointer;}

  /* detalle de un bloque del horario */
  .hd-row{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:12.5px;}
  .hd-row:last-of-type{border-bottom:none;}
  .hd-label{color:var(--text-muted); font-weight:700; flex-shrink:0;}
  .hd-value{color:var(--text); text-align:right;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <h1><span class="title-ramos">RamOS</span><span class="title-sep"></span><span class="title-wrap" id="titleWrap"><span class="title-section" id="titleSection">Inicio</span></span></h1>
    <button class="gear-btn" id="settingsBtn"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>

  <div class="screens">
    <div class="toast" id="toast"></div>

    <div class="screen active" id="screen-inicio">
      <div id="inicioWrap"></div>
    </div>
    <div class="screen" id="screen-horario">
      <div id="horarioWrap"></div>
    </div>

    <div class="screen" id="screen-info">
      <div id="ramosList"></div>
      <div class="add-frame big" id="addFrame"><div class="plus">+</div><div class="label">Añadir ramo</div></div>
    </div>

    <div class="screen" id="screen-promedio">
      <div id="promedioWrap"></div>
    </div>
    <div class="screen" id="screen-calendario">
      <div id="calendarioWrap"></div>
    </div>
  </div>

  <button class="btn btn-primary fab" id="uploadFabBtn" style="display:none;">Subir horario</button>
  <input type="file" id="pdfInput" accept="application/pdf" style="display:none;">

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="inicio"><span class="nav-icon-slot"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg></span><span>Inicio</span></button>
    <button class="nav-item" data-tab="horario"><span class="nav-icon-slot"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span><span>Horario</span></button>
    <button class="nav-item nav-item-main" data-tab="info">
      <span class="nav-icon-slot">
        <span class="tiktok-badge">
          <span class="tiktok-badge-shadow"></span>
          <span class="tiktok-badge-core"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
        </span>
      </span>
      <span>Ramos</span>
    </button>
    <button class="nav-item" data-tab="promedio"><span class="nav-icon-slot"><svg viewBox="0 0 24 24"><path d="M4 20V11M12 20V4M20 20v-7"/></svg></span><span>Promedio</span></button>
    <button class="nav-item" data-tab="calendario"><span class="nav-icon-slot"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="8.5" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="15.5" cy="14" r="1"/></svg></span><span>Calendario</span></button>
  </nav>

  <div class="choice-backdrop" id="choiceBackdrop">
    <div class="choice-card">
      <h3>Ya tienes ramos cargados</h3>
      <p>¿Qué quieres hacer con el horario nuevo?</p>
      <button class="choice-btn" data-mode="reemplazar">Reemplazar<span>Borra toda la info actual y carga desde cero</span></button>
      <button class="choice-btn" data-mode="actualizar">Actualizar<span>Mantiene lo que sigue igual, cambia solo lo que varió</span></button>
      <button class="choice-btn" data-mode="agregar">Agregar<span>Suma los ramos nuevos a los que ya tienes</span></button>
      <button class="choice-cancel" id="choiceCancelBtn">Cancelar</button>
    </div>
  </div>

  <div class="choice-backdrop" id="grupoOptionsBackdrop">
    <div class="choice-card">
      <h3>Opciones del grupo</h3>
      <label class="switch-row">
        <span class="switch-text">Eliminar peor nota</span>
        <span class="switch"><input type="checkbox" id="optElimPeor"><span class="track"><span class="thumb"></span></span></span>
      </label>
      <label class="switch-row">
        <span class="switch-text">Dividir ponderación igual</span>
        <span class="switch"><input type="checkbox" id="optDividirIgual"><span class="track"><span class="thumb"></span></span></span>
      </label>
      <button class="choice-btn" id="eliminarGrupoBtn" style="color:var(--danger); margin-top:10px;">Eliminar grupo<span>Borra el grupo completo y todas sus notas</span></button>
      <button class="choice-cancel" id="grupoOptionsCloseBtn">Listo</button>
    </div>
  </div>

  <div class="choice-backdrop" id="calBackdrop">
    <div class="picker-card">
      <div class="cal-header">
        <button type="button" id="calPrev">‹</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button type="button" id="calNext">›</button>
      </div>
      <div class="cal-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <div class="choice-backdrop" id="timeBackdrop">
    <div class="picker-card">
      <div id="timeWheelView">
        <div class="wheel-wrap">
          <div class="wheel-fade-top"></div>
          <div class="wheel-fade-bottom"></div>
          <div class="wheel-highlight"></div>
          <div class="wheel-col" id="wheelHour"></div>
          <div class="wheel-col" id="wheelMinute"></div>
          <div class="wheel-col wheel-ampm" id="wheelAmpm"></div>
        </div>
        <button type="button" class="mini-btn" id="showPresetsBtn" style="width:100%; margin-bottom:10px; justify-content:center;">Horas predeterminadas</button>
        <button type="button" class="btn-confirm" id="timeConfirmBtn">Listo</button>
      </div>
      <div id="timePresetsView" style="display:none;">
        <table class="preset-table">
          <thead><tr><th>Bloque</th><th>Hora</th></tr></thead>
          <tbody id="presetTableBody"></tbody>
        </table>
        <button type="button" class="choice-cancel" id="hidePresetsBtn">Volver</button>
      </div>
    </div>
  </div>

  <div class="choice-backdrop" id="settingsBackdrop">
    <div class="choice-card">
      <h3>Configuración</h3>
      <button class="choice-btn" id="descargarDatosBtn">Descargar copia<span>Guarda un archivo con todos tus ramos</span></button>
      <button class="choice-btn" id="abrirImportarBtn">Importar datos<span>Carga un archivo de respaldo guardado antes</span></button>
      <button class="choice-cancel" id="settingsCloseBtn">Cerrar</button>
    </div>
  </div>

  <div class="choice-backdrop" id="importBackdrop">
    <div class="choice-card">
      <h3>Importar datos</h3>
      <p>¿Qué quieres hacer con el archivo?</p>
      <button class="choice-btn" data-importmode="reemplazar">Reemplazar<span>Borra todo lo actual y carga desde el archivo</span></button>
      <button class="choice-btn" data-importmode="actualizar">Actualizar<span>Mantiene lo que sigue igual, cambia solo lo que varió (por código)</span></button>
      <button class="choice-btn" data-importmode="agregar">Agregar<span>Suma los ramos del archivo a los que ya tienes</span></button>
      <button class="choice-cancel" id="importCancelBtn">Cancelar</button>
    </div>
  </div>
  <input type="file" id="jsonFileInput" accept="application/json,.json" style="display:none;">

  <div class="choice-backdrop" id="calVistaDetalleBackdrop">
    <div class="picker-card" id="calVistaDetalleCard" style="max-height:78vh; overflow-y:auto;"></div>
  </div>

  <div class="choice-backdrop" id="horarioDetalleBackdrop">
    <div class="choice-card">
      <h3 id="hdNombre">Ramo</h3>
      <div class="hd-row"><span class="hd-label">Horario</span><span class="hd-value" id="hdHorario">—</span></div>
      <div class="hd-row"><span class="hd-label">Sala</span><span class="hd-value" id="hdSala">—</span></div>
      <div class="hd-row"><span class="hd-label">Tipo</span><span class="hd-value" id="hdTipo">—</span></div>
      <div class="hd-row"><span class="hd-label">Sección</span><span class="hd-value" id="hdSeccion">—</span></div>
      <div class="hd-row"><span class="hd-label">Profesor</span><span class="hd-value" id="hdProfesor">—</span></div>
      <div class="hd-row"><span class="hd-label">Correo</span><span class="hd-value" id="hdCorreo">—</span></div>
      <button class="choice-cancel" id="hdCloseBtn" style="margin-top:6px;">Cerrar</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-sheet" id="ramoModal">
    <div class="modal-drag-zone" id="modalDragZone"><div class="modal-handle"></div></div>
    <div class="modal-header"><h2 id="modalTitle">Nuevo ramo</h2><button class="close-x" id="closeModalBtn">✕</button></div>
    <div class="tab-switch" id="tabSwitch"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"><button class="btn btn-primary btn-block" id="saveRamoBtn">Guardar ramo</button></div>
  </div>

</div>

<script>
const BLOQUES = [
  {n:1, r:'08:15–09:35', sh:8, sm:15, eh:9, em:35}, {n:2, r:'09:50–11:10', sh:9, sm:50, eh:11, em:10}, {n:3, r:'11:25–12:45', sh:11, sm:25, eh:12, em:45},
  {n:4, r:'13:45–15:05', sh:13, sm:45, eh:15, em:5}, {n:5, r:'15:20–16:40', sh:15, sm:20, eh:16, em:40}, {n:6, r:'16:55–18:15', sh:16, sm:55, eh:18, em:15},
  {n:7, r:'18:45–20:05', sh:18, sm:45, eh:20, em:5}, {n:8, r:'20:05–21:25', sh:20, sm:5, eh:21, em:25}, {n:9, r:'21:25–22:45', sh:21, sm:25, eh:22, em:45}
];

function normalizarParaCorreo(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]/g,'');
}
function generarCorreoDesdeNombre(nombreCompleto, nivel){
  const partes = (nombreCompleto||'').trim().split(/\s+/).filter(Boolean);
  if(partes.length < 2) return '';
  const nombre1 = normalizarParaCorreo(partes[0]);
  const apellido1 = normalizarParaCorreo(partes.length>=3 ? partes[partes.length-2] : partes[1]);
  const apellido2Full = partes.length>=3 ? normalizarParaCorreo(partes[partes.length-1]) : '';
  if(!nombre1 || !apellido1) return '';
  let correo = `${nombre1}.${apellido1}`;
  if(nivel > 0 && apellido2Full){
    correo += '.' + apellido2Full.slice(0, Math.min(nivel, apellido2Full.length));
  }
  return correo + '@usach.cl';
}

function normalizarRamoCargado(r){
  r.nombre = r.nombre || '';
  r.codigo = r.codigo || '';
  r.profesorNombre = r.profesorNombre || '';
  r.profesorCorreo = r.profesorCorreo || '';
  r.coordinacion = r.coordinacion || '';
  r.horarios = Array.isArray(r.horarios) ? r.horarios : [];
  r.horarios.forEach(h=>{
    h.dia = h.dia || 'L';
    h.bloque = Number(h.bloque) || 1;
    h.sala = h.sala || '';
    h.tipo = h.tipo || 'teoria';
    h.dividir = !!h.dividir;
    h.pondTeoria = h.pondTeoria || 0;
    h.pondLab = h.pondLab || 0;
  });
  if(!r.poolCompartido || typeof r.poolCompartido !== 'object') r.poolCompartido = { grupos:[], sueltas:[] };
  if(!r.poolLaboratorio || typeof r.poolLaboratorio !== 'object') r.poolLaboratorio = { grupos:[], sueltas:[] };
  [r.poolCompartido, r.poolLaboratorio].forEach(pool=>{
    pool.sueltas = Array.isArray(pool.sueltas) ? pool.sueltas : [];
    pool.sueltas.forEach(e=>{
      e.nombre = e.nombre || ''; e.notaRaw = e.notaRaw || ''; e.ponderacion = e.ponderacion || 0;
      e.fecha = e.fecha || ''; e.hora = e.hora || ''; e.sala = e.sala || '';
    });
    pool.grupos = Array.isArray(pool.grupos) ? pool.grupos : [];
    pool.grupos.forEach(g=>{
      g.nombre = g.nombre || '';
      g.ponderacionGrupo = g.ponderacionGrupo || 0;
      g.eliminarPeorNota = !!g.eliminarPeorNota;
      g.dividirIgual = !!g.dividirIgual;
      g.evaluaciones = Array.isArray(g.evaluaciones) ? g.evaluaciones : [];
      g.evaluaciones.forEach(e=>{
        e.nombre = e.nombre || ''; e.notaRaw = e.notaRaw || ''; e.ponderacion = e.ponderacion || 0;
        e.fecha = e.fecha || ''; e.hora = e.hora || ''; e.sala = e.sala || '';
      });
    });
  });
  if(!r.id) r.id = generarId();
  return r;
}
function loadRamos(){
  try{
    const raw = localStorage.getItem('ramos_v1');
    const lista = raw ? JSON.parse(raw) : [];
    return Array.isArray(lista) ? lista.map(normalizarRamoCargado) : [];
  }catch(err){ return []; }
}
function saveRamos(){
  try{ localStorage.setItem('ramos_v1', JSON.stringify(ramos)); }

}

  const cs = getComputedStyle(document.getElementById('titleSection'));

function nuevoGrupo(){ return { nombre:'', ponderacionGrupo:0, eliminarPeorNota:false, dividirIgual:false, evaluaciones:[] }; }

function normalizarNota(raw){
  if(!raw) return null;
  let s = raw.trim().replace(',', '.');
  if(!s) return null;
  if(!s.includes('.') && s.length >= 2) s = s[0] + '.' + s.slice(1);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function autocompletarSalaSiCoincide(evaluacion){
  if(evaluacion.sala && evaluacion.sala.trim()) return false;
  if(!evaluacion.fecha || !evaluacion.hora) return false;
  const m1 = evaluacion.fecha.match(/^(\d{2})-(\d{2})-(\d{2})$/);
  if(!m1) return false;
  const fechaObj = new Date(2000+Number(m1[3]), Number(m1[2])-1, Number(m1[1]));
  const DIA_POR_NUM = {1:'L', 2:'M', 3:'W', 4:'J', 5:'V', 6:'S'};
  const diaCode = DIA_POR_NUM[fechaObj.getDay()];
  if(!diaCode) return false;

  const m2 = evaluacion.hora.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  if(!m2) return false;
  let h = parseInt(m2[1],10);
  const min = parseInt(m2[2],10);
  const ampm = m2[3].toUpperCase();
  if(ampm==='PM' && h!==12) h += 12;
  if(ampm==='AM' && h===12) h = 0;
  const minutosTotal = h*60 + min;

  const bloqueMatch = BLOQUES.find(b=> minutosTotal >= (b.sh*60+b.sm) && minutosTotal < (b.eh*60+b.em));
  if(!bloqueMatch) return false;

  const horarioMatch = draft.horarios.find(hh=> hh.dia===diaCode && hh.bloque===bloqueMatch.n);
  if(!horarioMatch || !horarioMatch.sala) return false;

  evaluacion.sala = horarioMatch.sala;
  return true;
}
function getDiscardedIndex(g){
  if(!g.eliminarPeorNota || g.evaluaciones.length<=1) return -1;
  let lastEmptyIdx = -1;
  g.evaluaciones.forEach((e,i)=>{ if(!e.notaRaw || !e.notaRaw.trim()) lastEmptyIdx = i; });
  if(lastEmptyIdx !== -1) return lastEmptyIdx;
  let worstIdx = -1, worstVal = Infinity;
  g.evaluaciones.forEach((e,i)=>{
    const val = normalizarNota(e.notaRaw);
    if(val !== null && val < worstVal){ worstVal = val; worstIdx = i; }
  });
  return worstIdx;
}
function aplicarDivisionIgualSiCorresponde(g){
  if(!g.dividirIgual) return;
  const n = g.evaluaciones.length;
  if(n===0) return;
  const discardedIdx = g.eliminarPeorNota ? getDiscardedIndex(g) : -1;
  const effectiveN = (g.eliminarPeorNota && discardedIdx !== -1) ? Math.max(n-1,1) : n;
  const each = Math.round(((g.ponderacionGrupo||0) / effectiveN) * 10) / 10;
  g.evaluaciones.forEach((e,i)=>{
    e.ponderacion = (g.eliminarPeorNota && i===discardedIdx) ? 0 : each;
  });
}
function nombreSiguiente(nombreAnterior){
  if(!nombreAnterior) return '';
  const m = nombreAnterior.match(/^(.*?)(\d+)\s*$/);
  if(!m) return '';
  return m[1] + (parseInt(m[2],10) + 1);
}
function autocompletarSecuenciaGrupo(grupo, indexModificado){
  const actual = grupo.evaluaciones[indexModificado];
  const m = (actual.nombre||'').match(/^(.*?)(\d+)\s*$/);
  if(!m) return;
  const prefijo = m[1];
  let siguienteNum = parseInt(m[2],10) + 1;
  for(let i = indexModificado+1; i < grupo.evaluaciones.length; i++){
    const e = grupo.evaluaciones[i];
    if(e.nombre && e.nombre.trim()) break;
    e.nombre = prefijo + siguienteNum;
    siguienteNum++;
  }
}

/* ---------- arrastrar el tirador para agrandar/achicar la tarjeta ---------- */
(function setupModalDrag(){
  const sheet = document.getElementById('ramoModal');
  const zone = document.getElementById('modalDragZone');
  let dragging = false, startY = 0, startHeight = 0;
  function begin(clientY){
    dragging = true;
    startY = clientY;
    startHeight = sheet.getBoundingClientRect().height;
    sheet.style.transition = 'none';
  }
  function move(clientY){
    if(!dragging) return;
    const delta = startY - clientY;
    const minH = window.innerHeight * 0.4;
    const maxH = window.innerHeight * 0.92;
    let newHeight = Math.max(minH, Math.min(maxH, startHeight + delta));
    sheet.style.height = newHeight + 'px';
  }
  function end(){
    dragging = false;
    sheet.style.transition = '';
  }
  zone.addEventListener('touchstart', e=> begin(e.touches[0].clientY), {passive:true});
  zone.addEventListener('touchmove', e=> move(e.touches[0].clientY), {passive:true});
  zone.addEventListener('touchend', end);
  zone.addEventListener('mousedown', e=>{ begin(e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', e=> move(e.clientY));
  window.addEventListener('mouseup', end);
})();

      if(el.dataset.hfield==='tipo'){ h.tipo = el.value; renderModal(); return; }

/* ---------- lista de ramos ---------- */
function summarizeInfo(r){
  const parts = [];
  if(r.profesorNombre) parts.push(r.profesorNombre);
  if(r.coordinacion) parts.push(r.coordinacion);
  return parts.length ? parts.join(' · ') : 'Sin profesor ni coordinación registrada';
}
function summarizeHorario(r){
  const total = r.horarios.length;
  if(!total) return 'Sin bloques de horario cargados';
  const dias = [...new Set(r.horarios.map(h=>DIAS.find(d=>d.v===h.dia)?.l).filter(Boolean))];
  return `${total} bloque${total>1?'s':''} · ${dias.join(', ')}`;
}
function summarizeEval(r){
  const nS = r.poolCompartido.sueltas.length, nG = r.poolCompartido.grupos.length;
  if(!nS && !nG) return 'Sin evaluaciones cargadas';
  const bits = [];
  if(nG) bits.push(`${nG} grupo${nG>1?'s':''}`);
  if(nS) bits.push(`${nS} suelta${nS>1?'s':''}`);
  return bits.join(' · ');
}

  showToast('Leyendo el PDF…');
  try{

    if(parsedRamos.length === 0){
      showToast('No reconocí ningún ramo en ese PDF. Agrégalos a mano con "+ Añadir ramo".');

function aplicarRamosImportados(parsedRamos, modo){
  if(modo==='reemplazar' || modo==='primero'){
    ramos = parsedRamos.map(ramoDesdeParsed);
  } else if(modo==='agregar'){
    parsedRamos.forEach(p=> ramos.push(ramoDesdeParsed(p)));
  } else if(modo==='actualizar'){
    parsedRamos.forEach(p=>{
      const existing = ramos.find(r=> r.codigo === p.codigo);
      if(existing){
        existing.nombre = p.nombre;
        existing.coordinacion = p.coordinacion;
        existing.horarios = p.horarios;
      } else {
        ramos.push(ramoDesdeParsed(p));
      }
    });
  }
  saveRamos();
  renderRamosList();
  showToast(`Se cargaron ${parsedRamos.length} ramo${parsedRamos.length>1?'s':''} desde el PDF.`);
}
function ramoDesdeParsed(p){
  const r = nuevoRamo();
  r.nombre = p.nombre;
  r.codigo = p.codigo;
  r.coordinacion = p.coordinacion;
  r.horarios = p.horarios;
  return r;
}

/* ---------- parser del PDF de horario (USACH) ---------- */
const BLOQUE_STARTS = ['08:15','09:50','11:25','13:45','15:20','16:55','18:45','20:05','21:25'];
const DIA_HEADER_MAP = { LUNES:'L', MARTES:'M', 'MIÉRCOLES':'W', 'MIERCOLES':'W', JUEVES:'J', VIERNES:'V', 'SÁBADO':'S', 'SABADO':'S' };
const STOPWORDS_NOMBRE = ['de','del','la','las','el','los','y','en','para','con','a','o','al'];

function capitalizarNombre(str){
  return str.toLowerCase().split(' ').map((w,i)=>{
    if(!w) return w;
    if(i>0 && STOPWORDS_NOMBRE.includes(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
}
function clusterLines(items, tol){
  const sorted = [...items].sort((a,b)=> b.y-a.y);
  const lines = [];
  sorted.forEach(it=>{
    let line = lines.find(l=> Math.abs(l.y-it.y) <= tol);
    if(!line){ line = { y: it.y, arr:[] }; lines.push(line); }
    line.arr.push(it);
  });
  return lines.map(l=> ({ y:l.y, text: l.arr.sort((a,b)=>a.x-b.x).map(i=>i.text).join(' ').replace(/\s+/g,' ').trim() }));
}

if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

async function parseHorarioPdf(file){
  if(!window.pdfjsLib) throw new Error('pdf.js no está disponible');

  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const content = await page.getTextContent();

  const NOISE = [/^\d{1,2}\.\d{3}\.\d{3}-[\dkK]$/i, /HORARIO SUJETO A MODIFICACIONES/i];
  const items = content.items
    .map(it=> {
      const fontSize = Math.hypot(it.transform[2], it.transform[3]);
      return { text: it.str.trim(), x: it.transform[4], y: it.transform[5], fontSize };
    })
    .filter(it=> it.text && it.fontSize < 15 && !NOISE.some(p=>p.test(it.text)));

  // tabla de asignaturas (Nº CODIGO NOMBRE COORD TIPO TEL HORARIO)
  const lines = clusterLines(items, 3);
  const asignaturas = [];
  const rowRegex = /^\d+\s+(\d{3,6}-\d)\s+(.+?)\s+([A-Za-z]-?\d)\s+([TEL])\s+\d\s+\S+/;
  lines.forEach(l=>{
    const m = l.text.match(rowRegex);
    if(m){
      asignaturas.push({ codigo:m[1], nombre:m[2].trim(), coord:m[3], tipo:{T:'teoria',E:'ejercicio',L:'laboratorio'}[m[4]] });
    }
  });

  // referencias de la grilla: x de cada día, y de cada bloque
  const diaX = {};
  items.forEach(it=>{
    const key = Object.keys(DIA_HEADER_MAP).find(k=> it.text.toUpperCase() === k);
    if(key && diaX[DIA_HEADER_MAP[key]] === undefined) diaX[DIA_HEADER_MAP[key]] = it.x;
  });
  const bloqueY = {};
  items.forEach(it=>{
    BLOQUE_STARTS.forEach((t, idx)=>{
      if(it.text.startsWith(t) && bloqueY[idx+1] === undefined) bloqueY[idx+1] = it.y;
    });
  });

  // celdas de la grilla: cada "codigo-coord" se empareja con la "Sala:" más cercana justo debajo
  // (en una misma fila hay varias celdas — una por día — así que el emparejamiento tiene que ser por posición, no por orden de lectura)
  const ccRegex = /^(\d{3,6}-\d)-([A-Za-z]-?\d)$/;
  const salaRegex = /^Sala:\s*(.+)$/i;
  const ccItems = items.filter(it=> ccRegex.test(it.text)).map(it=>{ const m=it.text.match(ccRegex); return {codigo:m[1], coord:m[2], x:it.x, y:it.y}; });
  const salaItems = items.filter(it=> salaRegex.test(it.text)).map(it=>{ const m=it.text.match(salaRegex); return {sala:m[1].trim(), x:it.x, y:it.y}; });
  const celdas = ccItems.map(cc=>{
    let best=null, bestDist=Infinity;
    salaItems.forEach(s=>{
      if(s.y < cc.y && (cc.y - s.y) < 15){
        const dist = Math.abs(s.x - cc.x);
        if(dist < bestDist){ bestDist = dist; best = s; }
      }
    });
    return { codigo:cc.codigo, coord:cc.coord, x:cc.x, y:cc.y, sala: best ? best.sala : '' };
  });

  function nearest(map, val){
    let best=null, bestD=Infinity;
    Object.entries(map).forEach(([k,v])=>{ const d=Math.abs(v-val); if(d<bestD){ bestD=d; best=k; } });
    return best;
  }
  celdas.forEach(c=>{
    c.dia = nearest(diaX, c.x);
    c.bloque = Number(nearest(bloqueY, c.y));
  });

  // agrupar por código y armar los ramos
  const porCodigo = {};
  celdas.forEach(c=>{
    if(!c.dia || !c.bloque) return;
    (porCodigo[c.codigo] = porCodigo[c.codigo] || []).push(c);
  });

  const ramosParsed = [];
  Object.keys(porCodigo).forEach(codigo=>{
    const filasAsig = asignaturas.filter(a=> a.codigo===codigo);
    const filaT = filasAsig.find(a=>a.tipo==='teoria') || filasAsig[0];
    if(!filaT) return;
    const horarios = porCodigo[codigo].map(c=>{
      const filaCoord = filasAsig.find(a=> a.coord===c.coord);
      return {
        dia:c.dia, bloque:c.bloque, sala:c.sala,
        tipo: filaCoord ? filaCoord.tipo : 'teoria',
        dividir:false, pondTeoria:0, pondLab:0
      };
    });
    ramosParsed.push({ codigo, nombre: capitalizarNombre(filaT.nombre), coordinacion: filaT.coord||'', horarios });
  });
  return ramosParsed;
}

/* ============ CALENDARIO PERSONALIZADO ============ */
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
let calTargetInput = null;
let calViewYear, calViewMonth;
let calSelected = null;

function pad2(n){ return String(n).padStart(2,'0'); }

function openCalendar(inputEl){
  calTargetInput = inputEl;
  const today = new Date();
  if(inputEl.dataset.y){
    calViewYear = Number(inputEl.dataset.y);
    calViewMonth = Number(inputEl.dataset.m);
    calSelected = { y:Number(inputEl.dataset.y), m:Number(inputEl.dataset.m), d:Number(inputEl.dataset.d) };
  } else {
    calViewYear = today.getFullYear();
    calViewMonth = today.getMonth();
    calSelected = null;
  }
  renderCalendar();
  document.getElementById('calBackdrop').classList.add('active');
}
function closeCalendar(){ document.getElementById('calBackdrop').classList.remove('active'); }

function renderCalendar(){
  document.getElementById('calMonthLabel').textContent = `${MESES[calViewMonth]} ${calViewYear}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  const firstOfMonth = new Date(calViewYear, calViewMonth, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(calViewYear, calViewMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calViewYear, calViewMonth, 0).getDate();
  const today = new Date();

  const cells = [];
  for(let i=startOffset; i>0; i--) cells.push({ d: daysInPrevMonth-i+1, other:true });
  for(let d=1; d<=daysInMonth; d++) cells.push({ d, other:false });
  let nextMonthDay = 1;
  while(cells.length % 7 !== 0) cells.push({ d: nextMonthDay++, other:true });
  grid.style.gridTemplateRows = `repeat(${cells.length/7}, 1fr)`;

  cells.forEach(c=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-day' + (c.other ? ' other-month' : '');
    const dot = document.createElement('span');
    dot.className = 'cal-day-dot';
    dot.textContent = c.d;
    btn.appendChild(dot);
    if(!c.other){
      const isToday = calViewYear===today.getFullYear() && calViewMonth===today.getMonth() && c.d===today.getDate();
      const isSelected = calSelected && calSelected.y===calViewYear && calSelected.m===calViewMonth && calSelected.d===c.d;
      if(isToday) btn.classList.add('today');
      if(isSelected) btn.classList.add('selected');
      btn.onclick = ()=> selectDay(c.d);
    }
    grid.appendChild(btn);
  });
}
function selectDay(d){
  calSelected = { y:calViewYear, m:calViewMonth, d };
  calTargetInput.value = `${pad2(d)}-${pad2(calViewMonth+1)}-${String(calViewYear).slice(2)}`;
  calTargetInput.dataset.y = calViewYear;
  calTargetInput.dataset.m = calViewMonth;

const HOURS = Array.from({length:12}, (_,i)=> i+1);
const MINUTES = Array.from({length:60}, (_,i)=> i);
const AMPM = ['AM','PM'];
const ITEM_H = 42;
let timeTargetInput = null;

function buildWheel(el, items, formatFn){
  el.innerHTML = '';
  const spacerTop = document.createElement('div'); spacerTop.className='wheel-spacer';
  const spacerBot = document.createElement('div'); spacerBot.className='wheel-spacer';
  el.appendChild(spacerTop);
  items.forEach(v=>{
    const div = document.createElement('div');
    div.className = 'wheel-item';
    div.textContent = formatFn(v);
    el.appendChild(div);
  });
  el.appendChild(spacerBot);
}
function scrollWheelToIndex(el, idx, smooth){ el.scrollTo({ top: idx*ITEM_H, behavior: smooth ? 'smooth' : 'auto' }); }
function setWheelInstant(el, idx){
  el.style.scrollSnapType = 'none';
  el.scrollTop = idx*ITEM_H;
  updateCenteredStyles(el);
  requestAnimationFrame(()=> requestAnimationFrame(()=>{ el.style.scrollSnapType = ''; updateCenteredStyles(el); }));
}
function setWheelsTo(h12, m, ampm){
  setWheelInstant(wheelHourEl, HOURS.indexOf(h12));
  setWheelInstant(wheelMinuteEl, MINUTES.indexOf(m));
  setWheelInstant(wheelAmpmEl, AMPM.indexOf(ampm));
}
function centeredIndex(el){ return Math.round(el.scrollTop / ITEM_H); }
function updateCenteredStyles(el){
  const idx = centeredIndex(el);
  el.querySelectorAll('.wheel-item').forEach((it,i)=> it.classList.toggle('centered', i===idx));
}
function attachWheelScroll(el){
  let t;
  el.addEventListener('scroll', ()=>{
    updateCenteredStyles(el);
    clearTimeout(t);
    t = setTimeout(()=>{
      scrollWheelToIndex(el, centeredIndex(el), true);
      updateCenteredStyles(el);
    }, 120);
  }, { passive:true });
}
const wheelHourEl = document.getElementById('wheelHour');
const wheelMinuteEl = document.getElementById('wheelMinute');
const wheelAmpmEl = document.getElementById('wheelAmpm');
buildWheel(wheelHourEl, HOURS, v=>v);
buildWheel(wheelMinuteEl, MINUTES, v=>pad2(v));

/* ---------- pestaña Inicio ---------- */
const DIA_NUM = {L:1, M:2, W:3, J:4, V:5, S:6};
const MESES_LARGO = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

function getBloqueStartDate(baseDate, dia, bloqueNum){
  const target = DIA_NUM[dia];
  if(!target) return null;
  const cur = baseDate.getDay()===0 ? 7 : baseDate.getDay();
  const d = new Date(baseDate);
  d.setDate(d.getDate() + (target - cur));
  const b = BLOQUES.find(x=>x.n===bloqueNum);
  if(!b) return null;
  d.setHours(b.sh, b.sm, 0, 0);
  return d;
}
function getProximasClases(){
  const now = new Date();
  const candidatos = [];
  ramos.forEach(r=>{
    r.horarios.forEach(h=>{
      let start = getBloqueStartDate(now, h.dia, h.bloque);
      if(!start) return;
      if(start.getTime() + 40*60000 <= now.getTime()) start = new Date(start.getTime() + 7*24*60*60000);
      candidatos.push({ ramo:r, h, start });
    });
  });
  candidatos.sort((a,b)=> a.start - b.start);
  return candidatos;
}
function parseFechaDDMMYY(str){
  if(!str) return null;
  const m = str.match(/^(\d{2})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  return new Date(2000+Number(m[3]), Number(m[2])-1, Number(m[1]));
}
function getProximasEvaluaciones(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const candidatos = [];
  ramos.forEach(r=>{
    const evals = [...r.poolCompartido.sueltas, ...r.poolCompartido.grupos.flatMap(g=>g.evaluaciones)];
    evals.forEach(e=>{
      const f = parseFechaDDMMYY(e.fecha);
      if(f && f.getTime() >= hoy.getTime()) candidatos.push({ ramo:r, e, fecha:f });
    });
  });
  candidatos.sort((a,b)=> a.fecha - b.fecha);
  return candidatos;
}
function getEvaluacionesDelMes(year, month){
  const map = {};
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  ramos.forEach(r=>{
    const evals = [...r.poolCompartido.sueltas, ...r.poolCompartido.grupos.flatMap(g=>g.evaluaciones)];
    evals.forEach(e=>{
      const f = parseFechaDDMMYY(e.fecha);
      if(!f || f.getFullYear()!==year || f.getMonth()!==month) return;
      const fSinHora = new Date(f); fSinHora.setHours(0,0,0,0);
      let estado;
      if(fSinHora.getTime() < hoy.getTime()) estado = 'pasada';
      else if(fSinHora.getTime() > hoy.getTime()) estado = 'futura';
      else estado = (e.notaRaw && e.notaRaw.trim()) ? 'pasada' : 'futura';
      const day = f.getDate();
      if(!map[day] || estado==='pasada') map[day] = estado;
    });
  });
  return map;
}

/* ---------- pestaña Promedio ---------- */
const NOTA_APROBACION = 3.95;

function getEvaluacionesEfectivas(ramo, pool){
  pool = pool || ramo.poolCompartido;
  const lista = [];
  pool.sueltas.forEach(e=>{
    lista.push({ nombre:e.nombre||'Evaluación', notaRaw:e.notaRaw, pond:Number(e.ponderacion)||0, grupo:null, excluida:false, pendienteCubierta:false });
  });
  pool.grupos.forEach(g=>{
    const discardedIdx = g.eliminarPeorNota ? getDiscardedIndex(g) : -1;
    g.evaluaciones.forEach((e,i)=>{
      const esDescartada = g.eliminarPeorNota && i===discardedIdx;
      const tieneNota = e.notaRaw && e.notaRaw.trim();
      lista.push({
        nombre: e.nombre || 'Evaluación',
        notaRaw: e.notaRaw,
        pond: esDescartada ? 0 : (Number(e.ponderacion)||0),
        grupo: g.nombre || 'Grupo',
        excluida: esDescartada,
        pendienteCubierta: esDescartada && !tieneNota
      });
    });
  });
  return lista;
}
function calcularPromediosDesdeLista(evals){
  evals = evals.filter(e=> !e.excluida);
  let sumaEntregadas = 0, pondEntregadas = 0, pondFaltante = 0, pondTotal = 0;
  evals.forEach(e=>{
    const nota = normalizarNota(e.notaRaw);
    const p = (e.pond||0) / 100;
    pondTotal += p;
    if(nota !== null){ sumaEntregadas += nota * p; pondEntregadas += p; }
    else pondFaltante += p;
  });
  const ponderado = pondEntregadas > 0 ? sumaEntregadas / pondEntregadas : null;
  const acumulado = sumaEntregadas;
  const real = sumaEntregadas + 1.0 * pondFaltante;
  let notaNecesaria = null;
  if(pondFaltante > 0 && pondTotal > 0){
    notaNecesaria = (NOTA_APROBACION * pondTotal - sumaEntregadas) / pondFaltante;
  }
  return { ponderado, acumulado, real, pondFaltante, pondTotal, notaNecesaria };
}
function calcularPromedios(ramo, pool){
  return calcularPromediosDesdeLista(getEvaluacionesEfectivas(ramo, pool));
}
function getPonderacionLabTeoria(ramo){
  const h = ramo.horarios.find(x=> x.tipo==='laboratorio' && x.dividir);
  if(!h) return { teoria:50, lab:50 };
  const t = Number(h.pondTeoria) || 0;
  const l = Number(h.pondLab) || 0;
  if(t===0 && l===0) return { teoria:50, lab:50 };
  return { teoria:t, lab:l };
}
function getEvaluacionesCombinadasPF(ramo){
  const { teoria, lab } = getPonderacionLabTeoria(ramo);
  const evT = getEvaluacionesEfectivas(ramo, ramo.poolCompartido).map(e=>({ ...e, pond: e.pond*(teoria/100), origen:'Teoría' }));
  const evL = getEvaluacionesEfectivas(ramo, ramo.poolLaboratorio).map(e=>({ ...e, pond: e.pond*(lab/100), origen:'Laboratorio' }));
  return [...evT, ...evL];
}

const POOL_STATES = ['teoria','laboratorio','pf'];
const POOL_STATE_ICONS = { teoria: ICON_CUADERNO+'<span>T</span>', laboratorio: ICON_MATRAZ+'<span>L</span>', pf: ICON_FLAG+'<span>PF</span>' };
const POOL_STATE_LABELS = { teoria:'Teoría', laboratorio:'Laboratorio', pf:'Promedio Final' };

let promedioExpandido = {};
let promedioPoolActivo = {};
function ramoTieneLabDividido(ramo){ return ramo.horarios.some(h=> h.tipo==='laboratorio' && h.dividir); }
function redondearArriba1Decimal(n){ return Math.ceil(n * 10 - 1e-9) / 10; }

  wrap.querySelectorAll('[data-promedioramo]').forEach(header=>{

function promedioCardHTML(ramo){
  const poolKey = promedioPoolActivo[ramo.id] || 'teoria';
  const esPF = poolKey==='pf';
  const evals = esPF ? getEvaluacionesCombinadasPF(ramo) : getEvaluacionesEfectivas(ramo, poolKey==='laboratorio' ? ramo.poolLaboratorio : ramo.poolCompartido);
  const stats = calcularPromediosDesdeLista(evals);
  const pasa = stats.ponderado !== null && stats.ponderado >= NOTA_APROBACION;
  const expandido = !!promedioExpandido[ramo.id];
  const tieneLab = ramoTieneLabDividido(ramo);
  const nextState = POOL_STATES[(POOL_STATES.indexOf(poolKey)+1) % POOL_STATES.length];
  const toggleHTML = tieneLab
    ? `<button type="button" class="mini-btn pool-toggle" data-promedlabtoggle="${ramo.id}">${POOL_STATE_ICONS[nextState]}</button>`
    : '';

  // agrupar filas por grupo (null = sueltas); en PF se distingue el origen (teoría/laboratorio)
  const grupos = {};
  evals.forEach(e=>{
    const key = esPF ? `${e.origen} · ${e.grupo || 'Sueltas'}` : (e.grupo || '__sueltas__');
    (grupos[key] = grupos[key] || []).push(e);
  });
  let filasHtml = '';
  let primeraEtiqueta = true;
  Object.keys(grupos).forEach(key=>{
    if(key!=='__sueltas__'){
      filasHtml += `<div class="promedio-grupo-label${primeraEtiqueta?' sin-borde':''}">${key}</div>`;
      primeraEtiqueta = false;
    }
    grupos[key].forEach(e=>{
      let notaTxt = e.notaRaw && e.notaRaw.trim() ? normalizarNota(e.notaRaw).toFixed(1) : '—';
      let rowClass = '';
      if(e.pendienteCubierta){ rowClass = 'cubierta'; notaTxt = 'En espera'; }
      else if(e.excluida){ rowClass = 'tachada'; }
      filasHtml += `<div class="promedio-eval-row ${rowClass}"><span class="promedio-eval-nombre">${e.nombre}</span><span class="promedio-eval-nota">${notaTxt}</span></div>`;
    });
  });

  let resultadoHtml;
  if(stats.ponderado === null){
    resultadoHtml = `<div class="promedio-resultado necesita">Sin notas suficientes para calcular.</div>`;
  } else if(stats.pondFaltante <= 0){
    resultadoHtml = pasa
      ? `<div class="promedio-resultado aprobado">Aprobado con <span class="num">${stats.ponderado.toFixed(1)}</span></div>`
      : `<div class="promedio-resultado necesita">Reprobado con <span class="num">${stats.ponderado.toFixed(1)}</span></div>`;
  } else if(stats.real >= NOTA_APROBACION){
    resultadoHtml = `<div class="promedio-resultado aprobado">Aprobado — asegurado con las notas que lleva</div>`;
  } else if(stats.notaNecesaria !== null && stats.notaNecesaria <= 7){
    resultadoHtml = `<div class="promedio-resultado necesita">Necesita <span class="num">${redondearArriba1Decimal(stats.notaNecesaria).toFixed(1)}</span> en lo que falta</div>`;
  } else {
    resultadoHtml = `<div class="promedio-resultado necesita">No es posible aprobar con lo que falta</div>`;
  }

  return `
  <div class="promedio-card${expandido?' expanded':''}">
    <div class="promedio-header" data-promedioramo="${ramo.id}">
      <div class="promedio-nombre">${ramo.nombre}<span class="sub">Toca para ver el detalle</span></div>
      <div class="promedio-num-wrap">
        <div class="promedio-num ${pasa?'pasa':'no-pasa'}">${stats.ponderado!==null ? stats.ponderado.toFixed(1) : '—'}</div>
        <div class="promedio-num-label">ponderado</div>
      </div>
    </div>
    <div class="promedio-detail${expandido?' expanded':''}" id="promDetail-${ramo.id}">
      <div class="promedio-detail-inner">
      ${toggleHTML ? `<div class="pool-toggle-row"><span class="pool-toggle-label">${POOL_STATE_LABELS[poolKey]}</span>${toggleHTML}</div>` : ''}
      ${filasHtml || '<p style="font-size:12.5px;color:var(--text-muted);">Sin evaluaciones cargadas.</p>'}
      <div class="promedio-stats">
        <div class="promedio-stat"><div class="promedio-stat-num">${stats.real.toFixed(1)}</div><div class="promedio-stat-label">Real</div></div>
        <div class="promedio-stat"><div class="promedio-stat-num">${stats.acumulado.toFixed(1)}</div><div class="promedio-stat-label">Acumulado</div></div>
      </div>
      ${resultadoHtml}
      </div>
    </div>
  </div>`;
}

/* ---------- pestaña Calendario ---------- */
let calVistaYear, calVistaMonth, calendarioViewMode = 'calendario';

function getTodasLasEvaluaciones(){
  const lista = [];
  ramos.forEach(r=>{
    const evals = [...r.poolCompartido.sueltas, ...r.poolCompartido.grupos.flatMap(g=>g.evaluaciones)];
    evals.forEach(e=>{
      const f = parseFechaDDMMYY(e.fecha);
      lista.push({ ramo:r, e, fecha:f });
    });
  });
  lista.sort((a,b)=>{
    if(!a.fecha && !b.fecha) return 0;
    if(!a.fecha) return 1;
    if(!b.fecha) return -1;
    return a.fecha - b.fecha;
  });
  return lista;
}
function initCalendarioTab(){
  const hoy = new Date();
  calVistaYear = hoy.getFullYear();
  calVistaMonth = hoy.getMonth();
  calendarioViewMode = 'calendario';
  renderCalendarioTab();
}
function renderCalendarioTab(){
  const wrap = document.getElementById('calendarioWrap');
  wrap.innerHTML = `
    <div class="tab-switch calvista-toggle" id="calVistaToggle">
      <button type="button" data-view="calendario" class="${calendarioViewMode==='calendario'?'active':''}">${ICON_HORARIO}Calendario</button>
      <button type="button" data-view="tabla" class="${calendarioViewMode==='tabla'?'active':''}">${ICON_INFO}Tabla</button>
    </div>
    <div id="calendarioContent"></div>
  `;
  wrap.querySelectorAll('[data-view]').forEach(btn=>{
    btn.onclick = ()=>{ calendarioViewMode = btn.dataset.view; renderCalendarioTab(); };
  });
  if(calendarioViewMode==='calendario') renderCalendarioVistaCalendario();
  else renderCalendarioVistaTabla();
}
function renderCalendarioVistaCalendario(){
  const content = document.getElementById('calendarioContent');
  content.innerHTML = `
    <div class="calvista-card">
      <div class="cal-header">
        <button type="button" id="calVistaPrev">‹</button>
        <span class="cal-month-label" id="calVistaMonthLabel"></span>
        <button type="button" id="calVistaNext">›</button>
      </div>
      <div class="cal-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="cal-grid" id="calVistaGrid"></div>
    </div>
  `;
  document.getElementById('calVistaPrev').onclick = ()=>{ calVistaMonth--; if(calVistaMonth<0){calVistaMonth=11; calVistaYear--;} renderCalVistaGrid(); };
  document.getElementById('calVistaNext').onclick = ()=>{ calVistaMonth++; if(calVistaMonth>11){calVistaMonth=0; calVistaYear++;} renderCalVistaGrid(); };
  renderCalVistaGrid();
}
function renderCalVistaGrid(){
  document.getElementById('calVistaDetalleBackdrop').classList.remove('active');
  document.getElementById('calVistaMonthLabel').textContent = `${MESES_LARGO[calVistaMonth]} ${calVistaYear}`;
  const grid = document.getElementById('calVistaGrid');
  const hoy = new Date();
  const evalMap = getEvaluacionesDelMes(calVistaYear, calVistaMonth);
  const todas = getTodasLasEvaluaciones();
  const evalsPorDia = {};
  todas.forEach(item=>{
    if(!item.fecha || item.fecha.getFullYear()!==calVistaYear || item.fecha.getMonth()!==calVistaMonth) return;
    (evalsPorDia[item.fecha.getDate()] = evalsPorDia[item.fecha.getDate()] || []).push(item);
  });

  const firstOfMonth = new Date(calVistaYear, calVistaMonth, 1);
  let startOffset = firstOfMonth.getDay() - 1;
  if(startOffset < 0) startOffset = 6;
  const daysInMonth = new Date(calVistaYear, calVistaMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calVistaYear, calVistaMonth, 0).getDate();

  const cells = [];
  for(let i=startOffset; i>0; i--) cells.push({ d: daysInPrevMonth-i+1, other:true });
  for(let d=1; d<=daysInMonth; d++) cells.push({ d, other:false });
  let nextMonthDay = 1;
  while(cells.length % 7 !== 0) cells.push({ d: nextMonthDay++, other:true });
  grid.style.gridTemplateRows = `repeat(${cells.length/7}, 1fr)`;

  grid.innerHTML = cells.map(c=>{
    if(c.other) return `<div class="cal-day other-month"><span class="cal-day-dot">${c.d}</span></div>`;
    const isToday = calVistaYear===hoy.getFullYear() && calVistaMonth===hoy.getMonth() && c.d===hoy.getDate();
    const estado = evalMap[c.d];
    const tieneEval = !!evalsPorDia[c.d];
    let inner;
    if(estado && isToday) inner = `<div class="mini-cal-marker ${estado} combo"><div class="mini-cal-today-dot">${c.d}</div></div>`;
    else if(estado) inner = `<div class="mini-cal-marker ${estado}">${c.d}</div>`;
    else if(isToday) inner = `<div class="mini-cal-today-dot">${c.d}</div>`;
    else inner = `<span class="cal-day-dot">${c.d}</span>`;
    return `<div class="cal-day${tieneEval?' clickable':''}" ${tieneEval?`data-seldia="${c.d}"`:''}>${inner}</div>`;
  }).join('');

  grid.querySelectorAll('[data-seldia]').forEach(cell=>{
    cell.onclick = ()=> mostrarDetalleDia(evalsPorDia[cell.dataset.seldia]);
  });
}
function mostrarDetalleDia(items){
  if(!items || items.length===0) return;
  const card = document.getElementById('calVistaDetalleCard');
  card.innerHTML = items.map((it,idx)=>`
    <div class="calvista-detalle-card">
      <div class="calvista-detalle-titulo">${it.ramo.nombre}</div>
      <div class="hd-row"><span class="hd-label">N</span><span class="hd-value">${idx+1}</span></div>
      <div class="hd-row"><span class="hd-label">Prueba</span><span class="hd-value">${it.e.nombre||'—'}</span></div>
      <div class="hd-row"><span class="hd-label">Fecha</span><span class="hd-value">${it.e.fecha||'—'}</span></div>
      <div class="hd-row"><span class="hd-label">Hora</span><span class="hd-value">${it.e.hora||'—'}</span></div>
      <div class="hd-row"><span class="hd-label">Nota</span><span class="hd-value">${it.e.notaRaw && it.e.notaRaw.trim() ? normalizarNota(it.e.notaRaw).toFixed(1) : '—'}</span></div>
      <div class="hd-row"><span class="hd-label">%</span><span class="hd-value">${it.e.ponderacion||0}%</span></div>
      <div class="hd-row"><span class="hd-label">Sala</span><span class="hd-value">${it.e.sala||'—'}</span></div>
    </div>
  `).join('') + `<button type="button" class="choice-cancel" id="calVistaDetalleCloseBtn">Cerrar</button>`;
  document.getElementById('calVistaDetalleBackdrop').classList.add('active');
  document.getElementById('calVistaDetalleCloseBtn').onclick = ()=> document.getElementById('calVistaDetalleBackdrop').classList.remove('active');
}
document.getElementById('calVistaDetalleBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='calVistaDetalleBackdrop') e.currentTarget.classList.remove('active'); });
function renderCalendarioVistaTabla(){
  const content = document.getElementById('calendarioContent');
  const todas = getTodasLasEvaluaciones();
  if(todas.length===0){
    content.innerHTML = `<div class="horario-empty"><p>No hay evaluaciones cargadas.</p></div>`;
    return;
  }
  const rows = todas.map((it,i)=>`
    <tr>
      <td>${i+1}</td>
      <td>${it.ramo.nombre}</td>
      <td>${it.e.nombre||'—'}</td>
      <td>${it.e.fecha||'—'}</td>
      <td>${it.e.hora||'—'}</td>
      <td>${it.e.notaRaw && it.e.notaRaw.trim() ? normalizarNota(it.e.notaRaw).toFixed(1) : '—'}</td>
      <td>${it.e.ponderacion||0}%</td>
      <td>${it.e.sala||'—'}</td>
    </tr>
  `).join('');
  content.innerHTML = `
    <div class="table-scroll">
      <table class="eval-table calendario-tabla">
        <thead><tr><th>N</th><th>Ramo</th><th>Prueba</th><th>Fecha</th><th>Hora</th><th>Nota</th><th>%</th><th>Sala</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

document.getElementById('titleWrap').style.width = (medirAnchoTitulo('Inicio') + 8 + 3) + 'px';
document.querySelector('.title-sep').style.height = medirAltoMayuscula() + 'px';
/* ---------- configuración: descargar / importar respaldo ---------- */
document.getElementById('settingsBtn').onclick = ()=>{
  document.getElementById('settingsBackdrop').classList.add('active');
};
document.getElementById('settingsCloseBtn').onclick = ()=>{
  document.getElementById('settingsBackdrop').classList.remove('active');
};
document.getElementById('settingsBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='settingsBackdrop') e.currentTarget.classList.remove('active'); });

document.getElementById('descargarDatosBtn').onclick = ()=>{
  const datos = JSON.stringify(ramos, null, 2);
  const blob = new Blob([datos], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ramos-respaldo.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  document.getElementById('settingsBackdrop').classList.remove('active');
  showToast('Copia descargada.');
};

let pendingImportMode = null;
document.getElementById('abrirImportarBtn').onclick = ()=>{
  document.getElementById('settingsBackdrop').classList.remove('active');
  document.getElementById('importBackdrop').classList.add('active');
};
document.getElementById('importCancelBtn').onclick = ()=>{
  document.getElementById('importBackdrop').classList.remove('active');
};
document.getElementById('importBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='importBackdrop') e.currentTarget.classList.remove('active'); });
document.querySelectorAll('[data-importmode]').forEach(btn=>{
  btn.onclick = ()=>{
    pendingImportMode = btn.dataset.importmode;
    document.getElementById('importBackdrop').classList.remove('active');
    document.getElementById('jsonFileInput').click();
  };
});
document.getElementById('jsonFileInput').onchange = async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const texto = await file.text();
    const data = JSON.parse(texto);
    if(!Array.isArray(data)) throw new Error('formato inválido');
    aplicarRamosImportadosJSON(data, pendingImportMode);
    showToast(`Se importaron ${data.length} ramo${data.length!==1?'s':''}.`);
  } catch(err){
    console.error(err);
    showToast('Ese archivo no es un respaldo válido de RamOS.');
  }
  pendingImportMode = null;
};
function aplicarRamosImportadosJSON(lista, modo){
  const normalizados = lista.map(r => normalizarRamoCargado(JSON.parse(JSON.stringify(r))));
  normalizados.forEach(r=> r.id = generarId());
  if(modo==='reemplazar'){
    ramos = normalizados;
  } else if(modo==='agregar'){
    normalizados.forEach(r=> ramos.push(r));
  } else if(modo==='actualizar'){
    normalizados.forEach(r=>{
      const existente = r.codigo ? ramos.find(x=> x.codigo === r.codigo) : null;
      if(existente){
        r.id = existente.id;
        Object.assign(existente, r);
      } else {
        ramos.push(r);
      }
    });
  }
  saveRamos();
  renderRamosList();
}

renderRamosList();
renderInicioTab();
</script>
