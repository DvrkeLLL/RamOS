<style>
  :root{
    --bg:#E7E3D8; --surface:#FFFFFF; --text:#26343A; --text-muted:#5C6B70;
    --primary:#2C6E7F; --primary-ink:#FFFFFF; --secondary:#B5651D; --border:#D8D3C4;
    --danger:#B5453A;
    --font-display:'Spectral',serif; --font-body:'Source Sans 3',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    overflow:hidden;
  }
  .app{position:relative; height:100vh; display:flex; flex-direction:column; max-width:480px; margin:0 auto; background:var(--bg);}
  .topbar{
    padding:20px 18px 12px; flex-shrink:0;
  }
  .topbar h1{font-family:var(--font-display); font-size:24px; font-weight:700; margin:0;}
  .topbar p{font-size:13px; color:var(--text-muted); margin:4px 0 0;}

  .screens{flex:1; overflow-y:auto; padding:0 18px 100px; -webkit-overflow-scrolling:touch;}
  .screen{display:none;}
  .screen.active{display:block;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-muted);
  }
  .empty-state p{font-size:14px; line-height:1.5; margin:0 0 18px;}

  /* ramo cards */
  .ramo-card{
    background:var(--surface); border:1px solid var(--border); border-left:5px solid var(--primary);
    border-radius:4px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(0,0,0,.05);
  }
  .ramo-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .ramo-card h3{font-family:var(--font-display); font-size:18px; font-weight:600; margin:0;}
  .ramo-card .codigo{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .ramo-card .componentes-tags{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
  .tag{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
    background:var(--bg); color:var(--text-muted); border:1px solid var(--border);
  }
  .ramo-card .prof{font-size:12.5px; color:var(--text-muted); margin-top:10px;}
  .ramo-card-actions{display:flex; gap:8px; margin-top:12px;}
  .icon-btn{
    border:none; background:transparent; color:var(--text-muted); font-size:12.5px;
    font-family:var(--font-body); font-weight:600; cursor:pointer; padding:4px 0;
  }
  .icon-btn.danger{color:var(--danger);}

  /* fab */
  .fab{
    position:absolute; right:18px; bottom:88px; z-index:5;
  }

  /* buttons */
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:14px; padding:12px 20px;
    cursor:pointer; border:2px solid var(--primary); border-radius:999px; box-shadow:0 3px 10px rgba(0,0,0,.14);
  }
  .btn-primary{background:var(--primary); color:var(--primary-ink);}
  .btn-secondary{background:transparent; color:var(--primary); box-shadow:none;}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 14px; font-size:13px; box-shadow:none;}
  .btn-ghost{background:transparent; color:var(--text-muted); border-color:var(--border); box-shadow:none;}

  /* bottom nav */
  .bottom-nav{
    position:absolute; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; cursor:pointer; color:var(--text-muted); padding:6px 0;
    font-family:var(--font-body);
  }
  .nav-item svg{width:22px; height:22px; stroke:var(--text-muted); fill:none; stroke-width:1.8;}
  .nav-item span{font-size:10.5px; font-weight:600;}
  .nav-item.active{color:var(--primary);}
  .nav-item.active svg{stroke:var(--primary);}

  /* overlay form */
  .overlay{
    position:absolute; inset:0; background:var(--bg); z-index:20; display:none;
    flex-direction:column; max-width:480px; margin:0 auto;
  }
  .overlay.active{display:flex;}
  .overlay-header{
    display:flex; align-items:center; justify-content:space-between; padding:16px 18px;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .overlay-header h2{font-family:var(--font-display); font-size:19px; margin:0;}
  .overlay-body{flex:1; overflow-y:auto; padding:16px 18px 100px;}
  .overlay-footer{padding:14px 18px calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex-shrink:0;}

  .close-x{background:none; border:none; font-size:20px; color:var(--text-muted); cursor:pointer; line-height:1;}

  fieldset{border:none; padding:0; margin:0 0 22px;}
  legend{font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:10px; padding:0;}
  .field-group{margin-bottom:12px;}
  .field-label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px; font-weight:600;}
  .field-row{display:flex; gap:8px;}
  .field-row .field-group{flex:1;}
  input[type=text], input[type=email], input[type=number], input[type=date], input[type=time], select{
    width:100%; font-family:var(--font-body); font-size:14px; padding:10px 11px; color:var(--text);
    background:var(--surface); border:1.5px solid var(--border); border-radius:8px; outline:none;
  }
  input:focus, select:focus{border-color:var(--primary);}

  .checkline{display:flex; align-items:center; gap:9px; padding:9px 0; cursor:pointer;}
  .checkline input{width:18px; height:18px; accent-color:var(--primary);}
  .checkline span{font-size:13.5px;}
  .checkline .sub{font-size:11.5px; color:var(--text-muted); display:block; margin-top:1px;}

  .radio-row{display:flex; gap:14px; margin:8px 0;}
  .radio-opt{display:flex; align-items:center; gap:6px; font-size:13px;}
  .radio-opt input{accent-color:var(--primary);}

  .subcard{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:14px; margin-bottom:12px;
  }
  .subcard-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .subcard-head strong{font-size:13.5px;}
  .remove-x{background:none; border:none; color:var(--text-muted); font-size:13px; cursor:pointer; font-weight:600;}

  .add-link{
    background:none; border:1.5px dashed var(--border); border-radius:8px; color:var(--primary);
    font-family:var(--font-body); font-weight:600; font-size:13px; padding:10px; width:100%; cursor:pointer;
  }
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:4px; line-height:1.4;}
  .divider{height:1px; background:var(--border); margin:20px 0;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar"><h1>RamOS</h1><p id="topSub">Segundo Semestre 2026</p></div>

  <div class="screens">
    <div class="screen" id="screen-inicio"><div class="empty-state"><p>Inicio — próximamente.</p></div></div>
    <div class="screen" id="screen-horario"><div class="empty-state"><p>Horario semanal — próximamente.</p></div></div>

    <div class="screen active" id="screen-info">
      <div id="ramosList"></div>
      <div class="empty-state" id="emptyInfo">
        <p>Todavía no agregas ningún ramo.<br>Ahí se va a concentrar toda la info que después llena Horario, Promedio y Calendario.</p>
      </div>
    </div>

    <div class="screen" id="screen-promedio"><div class="empty-state"><p>Promedio — próximamente.</p></div></div>
    <div class="screen" id="screen-calendario"><div class="empty-state"><p>Calendario — próximamente.</p></div></div>
  </div>

  <button class="btn btn-primary fab" id="addRamoBtn">+ Ramo</button>

  <nav class="bottom-nav">
    <button class="nav-item" data-tab="inicio">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      <span>Inicio</span>
    </button>
    <button class="nav-item" data-tab="horario">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
      <span>Horario</span>
    </button>
    <button class="nav-item active" data-tab="info">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.5v.01"/></svg>
      <span>Info</span>
    </button>
    <button class="nav-item" data-tab="promedio">
      <svg viewBox="0 0 24 24"><path d="M4 20V11M12 20V4M20 20v-7"/></svg>
      <span>Promedio</span>
    </button>
    <button class="nav-item" data-tab="calendario">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="8.5" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="15.5" cy="14" r="1"/></svg>
      <span>Calendario</span>
    </button>
  </nav>

  <!-- FORM OVERLAY -->
  <div class="overlay" id="ramoForm">
    <div class="overlay-header">
      <h2>Nuevo ramo</h2>
      <button class="close-x" id="closeFormBtn">✕</button>
    </div>
    <div class="overlay-body" id="formBody"></div>
    <div class="overlay-footer">
      <button class="btn btn-primary btn-block" id="saveRamoBtn">Guardar ramo</button>
    </div>
  </div>

</div>

<script>
const BLOQUES = [
  {n:1, r:'08:15–09:35'}, {n:2, r:'09:50–11:10'}, {n:3, r:'11:25–12:45'},
  {n:4, r:'13:45–15:05'}, {n:5, r:'15:20–16:40'}, {n:6, r:'16:55–18:15'},
  {n:7, r:'18:45–20:05'}, {n:8, r:'20:05–21:25'}, {n:9, r:'21:25–22:45'}
];
const DIAS = [{v:'L',l:'Lunes'},{v:'M',l:'Martes'},{v:'W',l:'Miércoles'},{v:'J',l:'Jueves'},{v:'V',l:'Viernes'},{v:'S',l:'Sábado'}];
const TIPO_LABEL = {teoria:'Teoría', laboratorio:'Laboratorio', ejercicio:'Ejercicio'};

let ramos = [];
let draft = null; // ramo en edición dentro del formulario

/* ---------- navegación ---------- */
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('screen-'+btn.dataset.tab).classList.add('active');
  };
});

/* ---------- helpers de estado ---------- */
function nuevoComponente(tipo){
  return { tipo, coordinacion:'', horarios:[], pool:{grupos:[], sueltas:[]} };
}
function nuevoRamo(){
  return {
    id: Date.now(),
    nombre:'', codigo:'', profesorNombre:'', profesorCorreo:'',
    tieneLab:false, tieneEjercicio:false, separado:false,
    componentes:[ nuevoComponente('teoria') ],
    poolCompartido: { grupos:[], sueltas:[] }
  };
}

/* ---------- abrir / cerrar formulario ---------- */
document.getElementById('addRamoBtn').onclick = ()=>{
  draft = nuevoRamo();
  renderForm();
  document.getElementById('ramoForm').classList.add('active');
};
document.getElementById('closeFormBtn').onclick = ()=>{
  document.getElementById('ramoForm').classList.remove('active');
};

/* ---------- render del formulario completo ---------- */
function renderForm(){
  const body = document.getElementById('formBody');
  body.innerHTML = '';

  body.appendChild(fieldset('Datos del ramo', datosRamoHTML()));
  body.appendChild(fieldset('Componentes', componentesToggleHTML()));

  draft.componentes.forEach((c, i)=>{
    body.appendChild(componenteBlock(c, i));
  });

  if(!draft.separado){
    body.appendChild(fieldset('Evaluaciones (pool único del ramo)', poolHTML(draft.poolCompartido, 'compartido')));
  }

  attachFormListeners();
}

function fieldset(title, innerHTML){
  const fs = document.createElement('fieldset');
  fs.innerHTML = `<legend>${title}</legend>${innerHTML}`;
  return fs;
}

function datosRamoHTML(){
  return `
    <div class="field-group">
      <label class="field-label">Nombre del ramo</label>
      <input type="text" id="f-nombre" value="${draft.nombre}" placeholder="Ej: Microeconomía">
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Código</label>
        <input type="text" id="f-codigo" value="${draft.codigo}" placeholder="14137-0">
      </div>
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Profesor</label>
        <input type="text" id="f-profNombre" value="${draft.profesorNombre}" placeholder="Nombre">
      </div>
      <div class="field-group">
        <label class="field-label">Correo</label>
        <input type="email" id="f-profCorreo" value="${draft.profesorCorreo}" placeholder="correo@usach.cl">
      </div>
    </div>
  `;
}

function componentesToggleHTML(){
  return `
    <label class="checkline">
      <input type="checkbox" id="f-tieneLab" ${draft.tieneLab?'checked':''}>
      <span>Tiene laboratorio</span>
    </label>
    <label class="checkline">
      <input type="checkbox" id="f-tieneEjercicio" ${draft.tieneEjercicio?'checked':''}>
      <span>Tiene ejercicio</span>
    </label>
    ${(draft.tieneLab||draft.tieneEjercicio) ? `
    <label class="checkline">
      <input type="checkbox" id="f-separado" ${draft.separado?'checked':''}>
      <span>Separar nota de teoría y laboratorio/ejercicio
        <span class="sub">Si lo dejas apagado, todas las evaluaciones caen en un solo pool que promedia el ramo completo.</span>
      </span>
    </label>` : ''}
  `;
}

function componenteBlock(c, idx){
  const fs = document.createElement('fieldset');
  const puedeQuitar = c.tipo !== 'teoria';
  fs.innerHTML = `
    <legend>${TIPO_LABEL[c.tipo]}${c.tipo!=='teoria' ? ' <span style="font-weight:400;color:var(--text-muted);font-size:12.5px;">— se muestra como "'+ (draft.nombre||'Ramo') +' - '+ (c.tipo==='laboratorio'?'L':'E') +'"</span>' : ''}</legend>
    ${c.tipo!=='ejercicio' ? `
    <div class="field-group">
      <label class="field-label">Coordinación</label>
      <input type="text" data-comp="${idx}" data-field="coordinacion" value="${c.coordinacion}" placeholder="Ej: A-3" style="max-width:120px;">
    </div>` : ''}
    <div id="horarios-${idx}"></div>
    <button type="button" class="add-link" data-addhorario="${idx}">+ Agregar bloque de horario</button>
    ${draft.separado ? `<div class="divider"></div><div id="pool-${idx}"></div>` : ''}
  `;
  renderHorarios(fs, c, idx);
  if(draft.separado){
    const poolWrap = fs.querySelector(`#pool-${idx}`);
    poolWrap.innerHTML = `<legend style="font-family:var(--font-display);font-size:14px;margin-bottom:8px;">Evaluaciones</legend>` + poolHTML(c.pool, idx);
  }
  return fs;
}

function renderHorarios(container, c, idx){
  const wrap = container.querySelector(`#horarios-${idx}`);
  wrap.innerHTML = c.horarios.map((h,hi)=>`
    <div class="subcard">
      <div class="subcard-head"><strong>Bloque ${hi+1}</strong><button type="button" class="remove-x" data-rmhorario="${idx}:${hi}">Quitar</button></div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Día</label>
          <select data-h="${idx}:${hi}" data-hfield="dia">
            ${DIAS.map(d=>`<option value="${d.v}" ${h.dia===d.v?'selected':''}>${d.l}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Bloque inicio</label>
          <select data-h="${idx}:${hi}" data-hfield="bloqueInicio">
            ${BLOQUES.map(b=>`<option value="${b.n}" ${h.bloqueInicio==b.n?'selected':''}>${b.n} · ${b.r}</option>`).join('')}
          </select>
        </div>
        <div class="field-group">
          <label class="field-label">Bloque fin</label>
          <select data-h="${idx}:${hi}" data-hfield="bloqueFin">
            ${BLOQUES.map(b=>`<option value="${b.n}" ${h.bloqueFin==b.n?'selected':''}>${b.n} · ${b.r}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Sala</label>
        <input type="text" data-h="${idx}:${hi}" data-hfield="sala" value="${h.sala}" placeholder="Ej: IND421">
      </div>
    </div>
  `).join('');
}

function poolHTML(pool, key){
  return `
    <div id="grupos-${key}"></div>
    <button type="button" class="add-link" data-addgrupo="${key}" style="margin-bottom:10px;">+ Agregar grupo de evaluaciones</button>
    <div id="sueltas-${key}"></div>
    <button type="button" class="add-link" data-addsuelta="${key}">+ Agregar evaluación suelta</button>
  `;
}

function renderPoolInner(pool, key, root){
  const gWrap = root.querySelector(`#grupos-${key}`);
  gWrap.innerHTML = pool.grupos.map((g,gi)=>grupoHTML(g,key,gi)).join('');
  const sWrap = root.querySelector(`#sueltas-${key}`);
  sWrap.innerHTML = pool.sueltas.map((e,ei)=>evaluacionHTML(e,key,'suelta',ei)).join('');
}

function grupoHTML(g,key,gi){
  return `
    <div class="subcard">
      <div class="subcard-head"><strong>Grupo</strong><button type="button" class="remove-x" data-rmgrupo="${key}:${gi}">Quitar grupo</button></div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Nombre del grupo</label>
          <input type="text" data-g="${key}:${gi}" data-gfield="nombre" value="${g.nombre}" placeholder="Ej: Controles">
        </div>
        <div class="field-group" style="max-width:90px;">
          <label class="field-label">% grupo</label>
          <input type="number" data-g="${key}:${gi}" data-gfield="ponderacionGrupo" value="${g.ponderacionGrupo}" placeholder="30">
        </div>
      </div>
      <label class="checkline">
        <input type="checkbox" data-g="${key}:${gi}" data-gfield="personalizado" ${g.personalizado?'checked':''}>
        <span>Personalizar<span class="sub">Control manual de % y eliminación por evaluación — para casos no estándar.</span></span>
      </label>
      ${!g.personalizado ? `
      <label class="checkline">
        <input type="checkbox" data-g="${key}:${gi}" data-gfield="distribuirIgual" ${g.distribuirIgual?'checked':''}>
        <span>Distribuir % en partes iguales</span>
      </label>
      <label class="checkline">
        <input type="checkbox" data-g="${key}:${gi}" data-gfield="eliminarPeorNota" ${g.eliminarPeorNota?'checked':''}>
        <span>Eliminar la peor nota del grupo</span>
      </label>
      ${g.eliminarPeorNota ? `
        <div class="radio-row">
          <label class="radio-opt"><input type="radio" name="crit-${key}-${gi}" data-g="${key}:${gi}" data-gfield="criterioEliminacion" value="menorNota" ${g.criterioEliminacion==='menorNota'?'checked':''}> Menor nota</label>
          <label class="radio-opt"><input type="radio" name="crit-${key}-${gi}" data-g="${key}:${gi}" data-gfield="criterioEliminacion" value="menorPonderacion" ${g.criterioEliminacion==='menorPonderacion'?'checked':''}> Menor ponderación</label>
        </div>
        <div class="field-group" style="max-width:90px;">
          <label class="field-label">Cuántas eliminar</label>
          <input type="number" min="1" data-g="${key}:${gi}" data-gfield="cantidadAEliminar" value="${g.cantidadAEliminar}">
        </div>
      ` : ''}
      ` : ''}
      <div class="divider"></div>
      <div id="evals-${key}-${gi}"></div>
      <button type="button" class="add-link" data-addeval="${key}:${gi}">+ Agregar evaluación</button>
    </div>
  `;
}

function evaluacionHTML(e,key,scope,idx1,idx2){
  const dataAttr = scope==='grupo' ? `data-e="${key}:${idx1}:${idx2}"` : `data-e="${key}:${idx1}"`;
  const rmAttr = scope==='grupo' ? `data-rmeval="${key}:${idx1}:${idx2}"` : `data-rmsuelta="${key}:${idx1}"`;
  return `
    <div class="subcard" style="background:var(--bg);">
      <div class="subcard-head"><strong>${e.nombre || 'Evaluación'}</strong><button type="button" class="remove-x" ${rmAttr}>Quitar</button></div>
      <div class="field-group">
        <label class="field-label">Nombre</label>
        <input type="text" ${dataAttr} data-efield="nombre" value="${e.nombre}" placeholder="Ej: Control 1">
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Nota</label>
          <input type="text" ${dataAttr} data-efield="notaRaw" value="${e.notaRaw}" placeholder="6,2 / 6.2 / 62">
        </div>
        <div class="field-group">
          <label class="field-label">% ponderación</label>
          <input type="number" ${dataAttr} data-efield="ponderacion" value="${e.ponderacion}" ${e.disabledPond?'disabled':''} placeholder="10">
        </div>
      </div>
      <div class="field-row">
        <div class="field-group">
          <label class="field-label">Fecha</label>
          <input type="date" ${dataAttr} data-efield="fecha" value="${e.fecha}">
        </div>
        <div class="field-group">
          <label class="field-label">Hora</label>
          <input type="time" ${dataAttr} data-efield="hora" value="${e.hora}">
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Sala</label>
        <input type="text" ${dataAttr} data-efield="sala" value="${e.sala}" placeholder="Ej: IND421">
      </div>
    </div>
  `;
}

function nuevoGrupo(){
  return { nombre:'', ponderacionGrupo:0, personalizado:false, distribuirIgual:true, eliminarPeorNota:false, criterioEliminacion:'menorNota', cantidadAEliminar:1, evaluaciones:[] };
}
function nuevaEvaluacion(){
  return { nombre:'', notaRaw:'', ponderacion:0, fecha:'', hora:'', sala:'' };
}

function getPool(key){
  if(key==='compartido') return draft.poolCompartido;
  return draft.componentes[key].pool;
}

/* ---------- listeners (delegación simple, se re-atan tras cada render) ---------- */
function attachFormListeners(){
  const body = document.getElementById('formBody');

  body.querySelectorAll('#f-nombre,#f-codigo,#f-profNombre,#f-profCorreo').forEach(el=>{
    el.oninput = ()=>{
      draft.nombre = document.getElementById('f-nombre').value;
      draft.codigo = document.getElementById('f-codigo').value;
      draft.profesorNombre = document.getElementById('f-profNombre').value;
      draft.profesorCorreo = document.getElementById('f-profCorreo').value;
    };
  });

  const labChk = document.getElementById('f-tieneLab');
  const ejChk = document.getElementById('f-tieneEjercicio');
  if(labChk) labChk.onchange = ()=>{
    draft.tieneLab = labChk.checked;
    syncComponentes(); renderForm();
  };
  if(ejChk) ejChk.onchange = ()=>{
    draft.tieneEjercicio = ejChk.checked;
    syncComponentes(); renderForm();
  };
  const sepChk = document.getElementById('f-separado');
  if(sepChk) sepChk.onchange = ()=>{ draft.separado = sepChk.checked; renderForm(); };

  body.querySelectorAll('[data-comp]').forEach(el=>{
    el.oninput = ()=>{ draft.componentes[el.dataset.comp][el.dataset.field] = el.value; };
  });

  body.querySelectorAll('[data-addhorario]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = btn.dataset.addhorario;
      draft.componentes[idx].horarios.push({dia:'L', bloqueInicio:1, bloqueFin:1, sala:''});
      renderForm();
    };
  });
  body.querySelectorAll('[data-rmhorario]').forEach(btn=>{
    btn.onclick = ()=>{
      const [idx,hi] = btn.dataset.rmhorario.split(':');
      draft.componentes[idx].horarios.splice(hi,1);
      renderForm();
    };
  });
  body.querySelectorAll('[data-h]').forEach(el=>{
    el.oninput = ()=>{
      const [idx,hi] = el.dataset.h.split(':');
      draft.componentes[idx].horarios[hi][el.dataset.hfield] = el.value;
    };
  });

  body.querySelectorAll('[data-addgrupo]').forEach(btn=>{
    btn.onclick = ()=>{
      getPool(isNaN(btn.dataset.addgrupo)?btn.dataset.addgrupo:Number(btn.dataset.addgrupo)).grupos.push(nuevoGrupo());
      renderForm();
    };
  });
  body.querySelectorAll('[data-addsuelta]').forEach(btn=>{
    btn.onclick = ()=>{
      getPool(isNaN(btn.dataset.addsuelta)?btn.dataset.addsuelta:Number(btn.dataset.addsuelta)).sueltas.push(nuevaEvaluacion());
      renderForm();
    };
  });
  body.querySelectorAll('[data-rmgrupo]').forEach(btn=>{
    btn.onclick = ()=>{
      const [key,gi] = btn.dataset.rmgrupo.split(':');
      getPool(isNaN(key)?key:Number(key)).grupos.splice(gi,1);
      renderForm();
    };
  });
  body.querySelectorAll('[data-rmsuelta]').forEach(btn=>{
    btn.onclick = ()=>{
      const [key,ei] = btn.dataset.rmsuelta.split(':');
      getPool(isNaN(key)?key:Number(key)).sueltas.splice(ei,1);
      renderForm();
    };
  });
  body.querySelectorAll('[data-addeval]').forEach(btn=>{
    btn.onclick = ()=>{
      const [key,gi] = btn.dataset.addeval.split(':');
      getPool(isNaN(key)?key:Number(key)).grupos[gi].evaluaciones.push(nuevaEvaluacion());
      renderForm();
    };
  });
  body.querySelectorAll('[data-rmeval]').forEach(btn=>{
    btn.onclick = ()=>{
      const [key,gi,ei] = btn.dataset.rmeval.split(':');
      getPool(isNaN(key)?key:Number(key)).grupos[gi].evaluaciones.splice(ei,1);
      renderForm();
    };
  });
  body.querySelectorAll('[data-g]').forEach(el=>{
    el.addEventListener(el.type==='checkbox'||el.type==='radio' ? 'change':'input', ()=>{
      const [key,gi] = el.dataset.g.split(':');
      const grupo = getPool(isNaN(key)?key:Number(key)).grupos[gi];
      const field = el.dataset.gfield;
      grupo[field] = el.type==='checkbox' ? el.checked : (el.type==='number' ? Number(el.value) : el.value);
      renderForm();
    });
  });
  body.querySelectorAll('[data-e]').forEach(el=>{
    el.oninput = ()=>{
      const parts = el.dataset.e.split(':');
      let target;
      if(parts.length===3){
        const [key,gi,ei]=parts;
        target = getPool(isNaN(key)?key:Number(key)).grupos[gi].evaluaciones[ei];
      } else {
        const [key,ei]=parts;
        target = getPool(isNaN(key)?key:Number(key)).sueltas[ei];
      }
      target[el.dataset.efield] = el.value;
    };
  });

  // render dinámico de grupos/sueltas dentro de cada pool visible
  document.querySelectorAll('[id^="grupos-"]').forEach(el=>{
    const key = el.id.replace('grupos-','');
    renderPoolInner(getPool(isNaN(key)?key:Number(key)), key, document.getElementById('formBody'));
  });
  // grupos internos: renderizar evaluaciones de cada grupo
  document.querySelectorAll('[id^="evals-"]').forEach(el=>{
    const [key,gi] = el.id.replace('evals-','').split('-');
    const grupo = getPool(isNaN(key)?key:Number(key)).grupos[gi];
    el.innerHTML = grupo.evaluaciones.map((e,ei)=>evaluacionHTML(e,key,'grupo',gi,ei)).join('');
  });
  // reatar listeners de los recién insertados (evaluaciones dentro de grupos)
  body.querySelectorAll('[data-e]').forEach(el=>{
    el.oninput = ()=>{
      const parts = el.dataset.e.split(':');
      let target;
      if(parts.length===3){
        const [key,gi,ei]=parts;
        target = getPool(isNaN(key)?key:Number(key)).grupos[gi].evaluaciones[ei];
      } else {
        const [key,ei]=parts;
        target = getPool(isNaN(key)?key:Number(key)).sueltas[ei];
      }
      target[el.dataset.efield] = el.value;
    };
  });
  body.querySelectorAll('[data-rmeval]').forEach(btn=>{
    btn.onclick = ()=>{
      const [key,gi,ei] = btn.dataset.rmeval.split(':');
      getPool(isNaN(key)?key:Number(key)).grupos[gi].evaluaciones.splice(ei,1);
      renderForm();
    };
  });
}

function syncComponentes(){
  const tieneLab = draft.tieneLab;
  const tieneEj = draft.tieneEjercicio;
  const teoria = draft.componentes.find(c=>c.tipo==='teoria');
  const nuevos = [teoria];
  if(tieneLab) nuevos.push(draft.componentes.find(c=>c.tipo==='laboratorio') || nuevoComponente('laboratorio'));
  if(tieneEj) nuevos.push(draft.componentes.find(c=>c.tipo==='ejercicio') || nuevoComponente('ejercicio'));
  draft.componentes = nuevos;
  if(!tieneLab && !tieneEj) draft.separado = false;
}

/* ---------- guardar ramo y pintar card ---------- */
document.getElementById('saveRamoBtn').onclick = ()=>{
  if(!draft.nombre.trim()){ alert('Ponle un nombre al ramo.'); return; }
  ramos.push(draft);
  renderRamosList();
  document.getElementById('ramoForm').classList.remove('active');
};

function renderRamosList(){
  const list = document.getElementById('ramosList');
  const empty = document.getElementById('emptyInfo');
  empty.style.display = ramos.length ? 'none' : 'block';
  list.innerHTML = ramos.map(r=>`
    <div class="ramo-card">
      <div class="ramo-card-top">
        <div>
          <h3>${r.nombre}</h3>
          <div class="codigo">${r.codigo || 'sin código'}</div>
        </div>
      </div>
      <div class="componentes-tags">
        ${r.componentes.map(c=>`<span class="tag">${TIPO_LABEL[c.tipo]}${c.coordinacion?' · '+c.coordinacion:''}</span>`).join('')}
        ${r.separado ? `<span class="tag">notas separadas</span>` : ''}
      </div>
      ${r.profesorNombre ? `<div class="prof">${r.profesorNombre}${r.profesorCorreo ? ' · '+r.profesorCorreo : ''}</div>` : ''}
      <div class="ramo-card-actions">
        <button class="icon-btn danger" data-delramo="${r.id}">Eliminar</button>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('[data-delramo]').forEach(btn=>{
    btn.onclick = ()=>{
      ramos = ramos.filter(r=>r.id != btn.dataset.delramo);
      renderRamosList();
    };
  });
}

renderRamosList();
</script>
</body>
</html>
