<style>
  :root{
    --bg:#F2F2F2; --surface:#FFFFFF; --text:#24344A; --text-muted:#68788D;
    --primary:#5C86B0; --primary-ink:#FFFFFF; --secondary:#35597D; --accent-eval:#A9C4DE; --border:#E1E4E8;
    --danger:#B5453A;
    --font-display:'Poppins',sans-serif; --font-body:'Nunito Sans',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); overflow:hidden;}
  .app{position:relative; height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:480px; margin:0 auto; background:var(--bg);}

  .topbar{padding:20px 18px 12px; flex-shrink:0;}
  .topbar h1{font-family:var(--font-display); font-size:23px; font-weight:700; margin:0;}

  .screens{flex:1; overflow-y:auto; padding:0 18px 110px; -webkit-overflow-scrolling:touch; position:relative;}
  .screen{display:none;}
  .screen.active{display:block;}

  .empty-state{text-align:center; padding:40px 10px 10px; color:var(--text-muted);}
  .empty-state p{font-size:13.5px; line-height:1.5; margin:0 0 4px;}

  .add-frame{border:2px dashed #C7CDD4; border-radius:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; color:var(--primary); background:rgba(92,134,176,.04); transition:background .15s ease;}
  .add-frame:active{background:rgba(92,134,176,.10);}
  .add-frame.big{flex-direction:column; min-height:220px; margin-top:14px;}
  .add-frame.big .plus{font-size:34px; font-weight:300; line-height:1;}
  .add-frame.big .label{font-family:var(--font-display); font-size:15px; font-weight:600;}
  .add-frame.compact{padding:14px; margin-top:4px; margin-bottom:14px;}
  .add-frame.compact .plus{font-size:18px; margin-right:2px;}
  .add-frame.compact .label{font-family:var(--font-body); font-size:13px; font-weight:700;}

  .ramo-card{background:var(--surface); border-radius:18px; margin-bottom:14px; box-shadow:0 4px 16px rgba(36,52,74,.08); overflow:hidden; cursor:pointer;}
  .ramo-card-header{padding:16px 16px 12px;}
  .ramo-card h3{font-family:var(--font-display); font-size:17px; font-weight:600; margin:0;}
  .ramo-card .codigo{font-size:12px; color:var(--text-muted); margin-top:2px;}
  .ramo-row{display:flex; align-items:flex-start; gap:10px; padding:8px 16px;}
  .ramo-row-icon{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}
  .ramo-row-icon svg{width:12px; height:12px; stroke-width:2; fill:none;}
  .ramo-row-text{font-size:12.5px; color:var(--text); line-height:1.4; padding-top:1px;}
  .ramo-card-actions{padding:6px 16px 14px;}
  .icon-btn{border:none; background:transparent; color:var(--text-muted); font-size:12.5px; font-family:var(--font-body); font-weight:700; cursor:pointer; padding:4px 0;}
  .icon-btn.danger{color:var(--danger);}

  .icon-info{background:rgba(53,89,125,.13);} .icon-info svg{stroke:var(--secondary);}
  .icon-horario{background:rgba(92,134,176,.15);} .icon-horario svg{stroke:var(--primary);}
  .icon-eval{background:rgba(169,196,222,.35);} .icon-eval svg{stroke:#5C86B0;}

  .fab{position:absolute; right:18px; bottom:88px; z-index:5;}

  .btn{font-family:var(--font-body); font-weight:700; font-size:14px; padding:12px 20px; cursor:pointer; border:2px solid var(--primary); border-radius:999px; box-shadow:0 3px 10px rgba(36,52,74,.16);}
  .btn-primary{background:var(--primary); color:var(--primary-ink);}
  .btn-secondary{background:transparent; color:var(--primary);}
  .btn-block{width:100%;}

  .bottom-nav{position:absolute; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--surface); border-top:1px solid var(--border); display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
  .nav-item{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; color:var(--text-muted); padding:6px 0; font-family:var(--font-body);}
  .nav-item svg{width:22px; height:22px; stroke:var(--text-muted); fill:none; stroke-width:1.8;}
  .nav-item span{font-size:10.5px; font-weight:700;}
  .nav-item.active{color:var(--primary);}
  .nav-item.active svg{stroke:var(--primary);}

  .toast{position:absolute; top:14px; left:16px; right:16px; background:var(--text); color:#fff; padding:12px 14px; border-radius:12px; font-size:12.5px; line-height:1.4; z-index:40; opacity:0; transform:translateY(-8px); transition:all .2s ease; pointer-events:none;}
  .toast.show{opacity:1; transform:translateY(0);}

  .choice-backdrop{position:absolute; inset:0; background:rgba(20,28,38,.4); z-index:28; display:none; align-items:center; justify-content:center; padding:22px;}
  .choice-backdrop.active{display:flex;}
  .choice-card{background:var(--surface); border-radius:18px; padding:20px; max-width:340px; width:100%;}
  .choice-card h3{font-family:var(--font-display); font-size:16px; margin:0 0 4px;}
  .choice-card>p{font-size:12.5px; color:var(--text-muted); margin:0 0 14px;}
  .choice-btn{display:block; width:100%; text-align:left; background:var(--bg); border:1.5px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-family:var(--font-body); font-weight:700; font-size:13px; color:var(--text); cursor:pointer;}
  .choice-btn span{display:block; font-weight:400; font-size:11px; color:var(--text-muted); margin-top:2px;}
  .choice-cancel{display:block; width:100%; text-align:center; background:none; border:none; color:var(--text-muted); font-family:var(--font-body); font-weight:700; font-size:13px; padding:8px; cursor:pointer;}

  .modal-backdrop{position:absolute; inset:0; background:rgba(20,28,38,.4); z-index:19; display:none;}
  .modal-backdrop.active{display:block;}
  .modal-sheet{position:absolute; left:0; right:0; bottom:0; max-height:85%; background:var(--surface); border-radius:22px 22px 0 0; z-index:20; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .25s ease; max-width:480px; margin:0 auto; box-shadow:0 -8px 24px rgba(0,0,0,.18);}
  .modal-sheet.active{transform:translateY(0);}
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:4px; margin:10px auto 0;}
  .modal-header{display:flex; align-items:center; justify-content:space-between; padding:10px 18px 0;}
  .modal-header h2{font-family:var(--font-display); font-size:18px; margin:0;}
  .close-x{background:none; border:none; font-size:20px; color:var(--text-muted); cursor:pointer; line-height:1;}

  .tab-switch{display:flex; gap:5px; padding:4px; background:var(--bg); border-radius:12px; margin:14px 18px;}
  .tab-switch button{flex:1; border:none; background:transparent; padding:9px 4px; border-radius:9px; font-family:var(--font-body); font-weight:700; font-size:11.5px; color:var(--text-muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .tab-switch button svg{width:15px; height:15px; stroke:var(--text-muted); fill:none; stroke-width:1.8;}
  .tab-switch button.active{background:var(--surface); color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,.08);}
  .tab-switch button.active svg{stroke:var(--primary);}

  .modal-body{flex:1; overflow-y:auto; padding:4px 18px 30px; -webkit-overflow-scrolling:touch;}
  .modal-footer{padding:12px 18px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); flex-shrink:0;}

  .field-group{margin-bottom:12px;}
  .field-label{display:block; font-size:12px; color:var(--text-muted); margin-bottom:5px; font-weight:700;}
  .field-row{display:flex; gap:8px;}
  .field-row .field-group{flex:1;}
  input[type=text], input[type=email], input[type=number], input[type=date], input[type=time], select{
    width:100%; font-family:var(--font-body); font-size:14px; padding:10px 11px; color:var(--text);
    background:var(--surface); border:1.5px solid var(--border); border-radius:8px; outline:none;
  }
  input:focus, select:focus{border-color:var(--primary);}
  .checkline{display:flex; align-items:center; gap:9px; padding:9px 0; cursor:pointer;}
  .checkline input{width:18px; height:18px; accent-color:var(--primary);}
  .checkline span{font-size:13.5px;}

  /* interruptor tipo píldora */
  .switch{position:relative; display:inline-block; width:38px; height:22px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0; position:absolute;}
  .switch .track{position:absolute; inset:0; background:var(--border); border-radius:999px; transition:background .2s ease; cursor:pointer;}
  .switch .thumb{position:absolute; left:2px; top:2px; width:18px; height:18px; background:#fff; border-radius:50%; transition:transform .2s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .switch input:checked + .track{background:var(--primary);}
  .switch input:checked + .track .thumb{transform:translateX(16px);}
  .switch.mini{width:30px; height:18px;}
  .switch.mini .thumb{width:14px; height:14px;}
  .switch.mini input:checked + .track .thumb{transform:translateX(12px);}
  .switch-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; cursor:pointer;}
  .switch-row .switch-text{font-size:13.5px;}
  .subcard{background:var(--bg); border-radius:12px; padding:12px; margin-bottom:10px;}
  .subcard-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .subcard-head strong{font-size:13px;}
  .remove-x{background:none; border:none; color:var(--text-muted); font-size:12.5px; cursor:pointer; font-weight:700;}
  .add-link{background:none; border:1.5px dashed var(--border); border-radius:8px; color:var(--primary); font-family:var(--font-body); font-weight:700; font-size:13px; padding:10px; width:100%; cursor:pointer;}
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:8px; line-height:1.4;}

  /* tabla de evaluaciones */
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:4px -2px 0;}
  .eval-table{border-collapse:collapse; width:100%; min-width:520px;}
  .eval-table.mini{min-width:460px;}
  .eval-table th{font-family:var(--font-body); font-weight:800; font-size:10px; color:var(--text-muted); text-align:left; padding:6px 4px; border-bottom:1.5px solid var(--border); white-space:nowrap;}
  .eval-table td{padding:4px 3px; border-bottom:1px solid var(--border); vertical-align:middle;}
  .eval-table input{width:100%; font-family:var(--font-body); font-size:12.5px; padding:7px 6px; border:1.5px solid var(--border); border-radius:7px; color:var(--text); background:var(--surface);}
  .eval-table .rm-row{background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; padding:0 4px;}

  /* grupos de evaluaciones */
  .eval-actions-row{display:flex; gap:8px; margin-top:12px;}
  .eval-actions-row .add-link{flex:1; margin-top:0;}
  .grupo-block{border:1.5px dashed var(--border); border-radius:12px; padding:10px; margin-top:10px; cursor:pointer;}
  .grupo-block.active{border-color:var(--primary); border-style:solid; background:rgba(92,134,176,.05);}
  .grupo-head{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .grupo-title{font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--text-muted);}
  .grupo-mini-check{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-muted); cursor:pointer;}
  .grupo-title{font-family:var(--font-display); font-size:12px; font-weight:700; color:var(--text-muted); outline:none; cursor:text; display:inline-block; min-width:16px;}
  .grupo-title:empty:before{content:attr(data-placeholder);}
  .grupo-pond{display:flex; align-items:center; gap:3px; margin-left:auto;}
  .grupo-pond input{width:46px; font-size:12px; padding:5px 6px; border:1.5px solid var(--border); border-radius:6px;}
  .grupo-pond span{font-size:11px; color:var(--text-muted);}
  .mini-btn{border:none; background:var(--bg); color:var(--primary); font-family:var(--font-body); font-weight:700; font-size:10.5px; padding:6px 9px; border-radius:8px; cursor:pointer;}
  .discarded-row{opacity:.5;}
  .discarded-row input{text-decoration:line-through;}
</style>
</head>
<body>
<div class="app">

  <div class="topbar"><h1>RamOS</h1></div>

  <div class="screens">
    <div class="toast" id="toast"></div>

    <div class="screen" id="screen-inicio"><div class="empty-state"><p>Inicio — próximamente.</p></div></div>
    <div class="screen" id="screen-horario"><div class="empty-state"><p>Horario semanal — próximamente.</p></div></div>

    <div class="screen active" id="screen-info">
      <div id="ramosList"></div>
      <div class="add-frame big" id="addFrame"><div class="plus">+</div><div class="label">Añadir ramo</div></div>
    </div>

    <div class="screen" id="screen-promedio"><div class="empty-state"><p>Promedio — próximamente.</p></div></div>
    <div class="screen" id="screen-calendario"><div class="empty-state"><p>Calendario — próximamente.</p></div></div>
  </div>

  <button class="btn btn-primary fab" id="uploadFabBtn">Subir horario</button>
  <input type="file" id="pdfInput" accept="application/pdf" style="display:none;">

  <nav class="bottom-nav">
    <button class="nav-item" data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg><span>Inicio</span></button>
    <button class="nav-item" data-tab="horario"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span>Horario</span></button>
    <button class="nav-item active" data-tab="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.5v.01"/></svg><span>Info</span></button>
    <button class="nav-item" data-tab="promedio"><svg viewBox="0 0 24 24"><path d="M4 20V11M12 20V4M20 20v-7"/></svg><span>Promedio</span></button>
    <button class="nav-item" data-tab="calendario"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="8.5" cy="14" r="1"/><circle cx="12" cy="14" r="1"/><circle cx="15.5" cy="14" r="1"/></svg><span>Calendario</span></button>
  </nav>

  <div class="choice-backdrop" id="choiceBackdrop">
    <div class="choice-card">
      <h3>Ya tienes ramos cargados</h3>
      <p>¿Qué quieres hacer con el horario nuevo?</p>
      <button class="choice-btn" data-mode="reemplazar">Reemplazar<span>Borra toda la info actual y carga desde cero</span></button>
      <button class="choice-btn" data-mode="actualizar">Actualizar<span>Mantiene lo que sigue igual, cambia solo lo que varió</span></button>
      <button class="choice-btn" data-mode="agregar">Agregar<span>Suma los ramos nuevos a los que ya tienes</span></button>
      <button class="choice-cancel" id="choiceCancelBtn">Cancelar</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-sheet" id="ramoModal">
    <div class="modal-handle"></div>
    <div class="modal-header"><h2 id="modalTitle">Nuevo ramo</h2><button class="close-x" id="closeModalBtn">✕</button></div>
    <div class="tab-switch" id="tabSwitch"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer"><button class="btn btn-primary btn-block" id="saveRamoBtn">Guardar ramo</button></div>
  </div>

</div>

<script>
const BLOQUES = [
  {n:1, r:'08:15–09:35'}, {n:2, r:'09:50–11:10'}, {n:3, r:'11:25–12:45'},
  {n:4, r:'13:45–15:05'}, {n:5, r:'15:20–16:40'}, {n:6, r:'16:55–18:15'},
  {n:7, r:'18:45–20:05'}, {n:8, r:'20:05–21:25'}, {n:9, r:'21:25–22:45'}
];
const DIAS = [{v:'L',l:'Lunes'},{v:'M',l:'Martes'},{v:'W',l:'Miércoles'},{v:'J',l:'Jueves'},{v:'V',l:'Viernes'},{v:'S',l:'Sábado'}];

const ICON_INFO = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M9.5 12.5h5M9.5 16h5"/></svg>';
const ICON_HORARIO = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const ICON_EVAL = '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5"/><path d="M9 13.5 7 21l5-2.5 5 2.5-2-7.5"/></svg>';

let ramos = loadRamos();
let draft = null;
let editingId = null;
let modalTab = 'evaluaciones';
let activeGroupIndex = null;
let pendingUploadMode = null;
let toastTimer = null;

function loadRamos(){
  try{
    const raw = localStorage.getItem('ramos_v1');
    return raw ? JSON.parse(raw) : [];
  }catch(err){ return []; }
}
function saveRamos(){
  try{ localStorage.setItem('ramos_v1', JSON.stringify(ramos)); }
  catch(err){ showToast('No se pudo guardar en este navegador.'); }
}

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('screen-'+btn.dataset.tab).classList.add('active');
  };
});

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 3600);
}

/* ---------- estado ---------- */
function nuevoRamo(){
  return {
    id: Date.now(),
    nombre:'', codigo:'', profesorNombre:'', profesorCorreo:'', coordinacion:'',
    horarios: [],
    poolCompartido: { grupos:[], sueltas:[] }
  };
}
function nuevaEvaluacion(){ return { nombre:'', notaRaw:'', ponderacion:0, fecha:'', hora:'', sala:'' }; }
function nuevoHorario(){ return { dia:'L', bloque:1, sala:'', tipo:'teoria', dividir:false, pondTeoria:0, pondLab:0 }; }
function nuevoGrupo(){ return { nombre:'', ponderacionGrupo:0, eliminarPeorNota:false, evaluaciones:[] }; }

function normalizarNota(raw){
  if(!raw) return null;
  let s = raw.trim().replace(',', '.');
  if(!s) return null;
  if(!s.includes('.') && s.length >= 2) s = s[0] + '.' + s.slice(1);
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function getDiscardedIndex(g){
  if(!g.eliminarPeorNota || g.evaluaciones.length===0) return -1;
  let lastEmptyIdx = -1;
  g.evaluaciones.forEach((e,i)=>{ if(!e.notaRaw || !e.notaRaw.trim()) lastEmptyIdx = i; });
  if(lastEmptyIdx !== -1) return lastEmptyIdx;
  let worstIdx = -1, worstVal = Infinity;
  g.evaluaciones.forEach((e,i)=>{
    const val = normalizarNota(e.notaRaw);
    if(val !== null && val < worstVal){ worstVal = val; worstIdx = i; }
  });
  return worstIdx;
}
function dividirPonderacionIgual(g){
  const n = g.evaluaciones.length;
  if(n===0) return;
  const discardedIdx = g.eliminarPeorNota ? getDiscardedIndex(g) : -1;
  const effectiveN = (g.eliminarPeorNota && discardedIdx !== -1) ? Math.max(n-1,1) : n;
  const each = Math.round((g.ponderacionGrupo / effectiveN) * 10) / 10;
  g.evaluaciones.forEach((e,i)=>{
    e.ponderacion = (g.eliminarPeorNota && i===discardedIdx) ? 0 : each;
  });
}
function nombreSiguiente(nombreAnterior){
  if(!nombreAnterior) return '';
  const m = nombreAnterior.match(/^(.*?)(\d+)\s*$/);
  if(!m) return '';
  return m[1] + (parseInt(m[2],10) + 1);
}

/* ---------- abrir / cerrar modal de ramo ---------- */
document.getElementById('addFrame').onclick = ()=>{
  draft = nuevoRamo();
  editingId = null;
  modalTab = 'evaluaciones';
  activeGroupIndex = null;
  document.getElementById('modalTitle').textContent = 'Nuevo ramo';
  renderModal();
  document.getElementById('modalBackdrop').classList.add('active');
  document.getElementById('ramoModal').classList.add('active');
};
function openEditRamo(id){
  const r = ramos.find(x=>x.id===id);
  if(!r) return;
  draft = JSON.parse(JSON.stringify(r));
  editingId = id;
  modalTab = 'evaluaciones';
  activeGroupIndex = null;
  document.getElementById('modalTitle').textContent = draft.nombre || 'Editar ramo';
  renderModal();
  document.getElementById('modalBackdrop').classList.add('active');
  document.getElementById('ramoModal').classList.add('active');
}
function closeRamoModal(){
  document.getElementById('modalBackdrop').classList.remove('active');
  document.getElementById('ramoModal').classList.remove('active');
}
document.getElementById('closeModalBtn').onclick = closeRamoModal;
document.getElementById('modalBackdrop').onclick = closeRamoModal;

/* ---------- tabs ---------- */
const TABS = [
  {id:'evaluaciones', label:'Evaluaciones', icon:ICON_EVAL},
  {id:'horario', label:'Horario', icon:ICON_HORARIO},
  {id:'info', label:'Información', icon:ICON_INFO}
];
function renderTabSwitch(){
  const row = document.getElementById('tabSwitch');
  row.innerHTML = TABS.map(t=>`<button type="button" data-modaltab="${t.id}" class="${modalTab===t.id?'active':''}">${t.icon}${t.label}</button>`).join('');
  row.querySelectorAll('[data-modaltab]').forEach(btn=>{
    btn.onclick = ()=>{ modalTab = btn.dataset.modaltab; renderModal(); };
  });
}
function renderModal(){
  renderTabSwitch();
  const body = document.getElementById('modalBody');
  if(modalTab==='evaluaciones') body.innerHTML = evalTabHTML();
  else if(modalTab==='horario') body.innerHTML = horarioTabHTML();
  else body.innerHTML = infoTabHTML();
  attachModalListeners();
}

/* ---------- tab: Evaluaciones ---------- */
function evalTabHTML(){
  const actionsHTML = activeGroupIndex === null
    ? `<button type="button" class="add-link" id="addEvalRowBtn">+ Fila</button><button type="button" class="add-link" id="crearGrupoBtn">Crear grupo</button>`
    : `<button type="button" class="add-link" id="addGrupoRowBtn">+ Fila grupo</button><button type="button" class="add-link" id="terminarGrupoBtn">Terminar grupo</button>`;
  return `
    <div class="table-scroll">
      <table class="eval-table">
        <thead><tr><th>Evaluación</th><th>Nota</th><th>%</th><th>Fecha</th><th>Hora</th><th>Sala</th><th></th></tr></thead>
        <tbody>${draft.poolCompartido.sueltas.map((e,i)=>evalRowHTML(e,i)).join('')}</tbody>
      </table>
    </div>
    <div id="gruposWrap">${draft.poolCompartido.grupos.map((g,gi)=>grupoBlockHTML(g,gi)).join('')}</div>
    <div class="eval-actions-row">${actionsHTML}</div>
    <p class="hint">Toca el borde de un grupo ya creado para volver a editarlo y agregar más pruebas.</p>
  `;
}
function evalRowHTML(e, i, grupoIdx, isDiscarded){
  const g = grupoIdx!==undefined ? ` data-egroup="${grupoIdx}"` : '';
  const trClass = isDiscarded ? ' class="discarded-row"' : '';
  return `<tr${trClass}>
    <td><input type="text" data-erow="${i}"${g} data-efield="nombre" value="${e.nombre}" placeholder="Control 1" style="min-width:110px;"></td>
    <td><input type="text" data-erow="${i}"${g} data-efield="notaRaw" value="${e.notaRaw}" placeholder="6,2" style="width:56px;"></td>
    <td><input type="number" data-erow="${i}"${g} data-efield="ponderacion" value="${e.ponderacion}" placeholder="10" style="width:52px;"></td>
    <td><input type="date" data-erow="${i}"${g} data-efield="fecha" value="${e.fecha}" style="min-width:130px;"></td>
    <td><input type="time" data-erow="${i}"${g} data-efield="hora" value="${e.hora}" style="min-width:90px;"></td>
    <td><input type="text" data-erow="${i}"${g} data-efield="sala" value="${e.sala}" placeholder="IND421" style="width:70px;"></td>
    <td><button type="button" class="rm-row" data-rmrow="${i}"${g}>×</button></td>
  </tr>`;
}
function grupoBlockHTML(g, gi){
  const active = activeGroupIndex === gi;
  const discardedIdx = g.eliminarPeorNota ? getDiscardedIndex(g) : -1;
  return `
  <div class="grupo-block${active?' active':''}" data-grupoborder="${gi}">
    <div class="grupo-head">
      <span class="grupo-title" contenteditable="true" data-g="${gi}" data-gfield="nombre" data-placeholder="Grupo ${gi+1}">${g.nombre||''}</span>
      <label class="grupo-mini-check">
        <span class="switch mini"><input type="checkbox" data-g="${gi}" data-gfield="eliminarPeorNota" ${g.eliminarPeorNota?'checked':''}><span class="track"><span class="thumb"></span></span></span>
        <span>Eliminar peor nota</span>
      </label>
      <button type="button" class="mini-btn" data-dividepond="${gi}">Dividir ponderación igual</button>
      <div class="grupo-pond"><input type="number" data-g="${gi}" data-gfield="ponderacionGrupo" value="${g.ponderacionGrupo}" placeholder="0"><span>%</span></div>
    </div>
    <div class="table-scroll">
      <table class="eval-table mini"><tbody>${g.evaluaciones.map((e,ei)=>evalRowHTML(e,ei,gi,ei===discardedIdx)).join('')}</tbody></table>
    </div>
  </div>`;
}

/* ---------- tab: Horario ---------- */
function horarioTabHTML(){
  return `
    <div id="horarioRows">${draft.horarios.map((h,i)=>horarioRowHTML(h,i)).join('')}</div>
    <button type="button" class="add-link" id="addHorarioBtn">+ Agregar bloque de horario</button>
  `;
}
function horarioRowHTML(h, i){
  return `
  <div class="subcard">
    <div class="subcard-head"><strong>Bloque ${i+1}</strong><button type="button" class="remove-x" data-rmhorario="${i}">Quitar</button></div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Día</label>
        <select data-h="${i}" data-hfield="dia">${DIAS.map(d=>`<option value="${d.v}" ${h.dia===d.v?'selected':''}>${d.l}</option>`).join('')}</select>
      </div>
      <div class="field-group">
        <label class="field-label">Bloque</label>
        <select data-h="${i}" data-hfield="bloque">${BLOQUES.map(b=>`<option value="${b.n}" ${h.bloque==b.n?'selected':''}>${b.n} · ${b.r}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Sala</label>
      <input type="text" data-h="${i}" data-hfield="sala" value="${h.sala}" placeholder="Ej: IND421">
    </div>
    <div class="field-group">
      <label class="field-label">Tipo</label>
      <select data-h="${i}" data-hfield="tipo">
        <option value="teoria" ${h.tipo==='teoria'?'selected':''}>Teoría</option>
        <option value="ejercicio" ${h.tipo==='ejercicio'?'selected':''}>Ejercicio</option>
        <option value="laboratorio" ${h.tipo==='laboratorio'?'selected':''}>Laboratorio</option>
      </select>
    </div>
    ${h.tipo==='laboratorio' ? `
    <label class="switch-row">
      <span class="switch-text">Dividir notas de lab y teoría</span>
      <span class="switch"><input type="checkbox" data-h="${i}" data-hfield="dividirBool" ${h.dividir?'checked':''}><span class="track"><span class="thumb"></span></span></span>
    </label>
    ${h.dividir ? `
    <div class="field-row">
      <div class="field-group"><label class="field-label">% Teoría</label><input type="number" data-h="${i}" data-hfield="pondTeoria" value="${h.pondTeoria}"></div>
      <div class="field-group"><label class="field-label">% Laboratorio</label><input type="number" data-h="${i}" data-hfield="pondLab" value="${h.pondLab}"></div>
    </div>` : ''}
    ` : ''}
  </div>`;
}

/* ---------- tab: Información ---------- */
function infoTabHTML(){
  return `
    <div class="field-group"><label class="field-label">Nombre del ramo</label><input type="text" id="f-nombre" value="${draft.nombre}" placeholder="Ej: Microeconomía"></div>
    <div class="field-group"><label class="field-label">Código</label><input type="text" id="f-codigo" value="${draft.codigo}" placeholder="14137-0"></div>
    <div class="field-row">
      <div class="field-group"><label class="field-label">Profesor</label><input type="text" id="f-profNombre" value="${draft.profesorNombre}" placeholder="Nombre"></div>
      <div class="field-group"><label class="field-label">Correo</label><input type="email" id="f-profCorreo" value="${draft.profesorCorreo}" placeholder="correo@usach.cl"></div>
    </div>
    <div class="field-group"><label class="field-label">Coordinación</label><input type="text" id="f-coordinacion" value="${draft.coordinacion}" placeholder="Ej: A-3" style="max-width:140px;"></div>
  `;
}

/* ---------- listeners del modal ---------- */
function attachModalListeners(){
  const body = document.getElementById('modalBody');

  // Evaluaciones — filas sueltas / grupo activo
  const addEvalBtn = document.getElementById('addEvalRowBtn');
  if(addEvalBtn) addEvalBtn.onclick = ()=>{ draft.poolCompartido.sueltas.push(nuevaEvaluacion()); renderModal(); };
  const crearGrupoBtn = document.getElementById('crearGrupoBtn');
  if(crearGrupoBtn) crearGrupoBtn.onclick = ()=>{
    draft.poolCompartido.grupos.push(nuevoGrupo());
    activeGroupIndex = draft.poolCompartido.grupos.length - 1;
    renderModal();
  };
  const addGrupoRowBtn = document.getElementById('addGrupoRowBtn');
  if(addGrupoRowBtn) addGrupoRowBtn.onclick = ()=>{
    const grupo = draft.poolCompartido.grupos[activeGroupIndex];
    const last = grupo.evaluaciones[grupo.evaluaciones.length-1];
    const nueva = nuevaEvaluacion();
    if(last) nueva.nombre = nombreSiguiente(last.nombre);
    grupo.evaluaciones.push(nueva);
    renderModal();
  };
  const terminarGrupoBtn = document.getElementById('terminarGrupoBtn');
  if(terminarGrupoBtn) terminarGrupoBtn.onclick = ()=>{ activeGroupIndex = null; renderModal(); };

  body.querySelectorAll('[data-rmrow]').forEach(btn=>{
    btn.onclick = ()=>{
      if(btn.dataset.egroup !== undefined) draft.poolCompartido.grupos[btn.dataset.egroup].evaluaciones.splice(btn.dataset.rmrow,1);
      else draft.poolCompartido.sueltas.splice(btn.dataset.rmrow,1);
      renderModal();
    };
  });
  body.querySelectorAll('[data-erow]').forEach(el=>{
    el.oninput = ()=>{
      const target = el.dataset.egroup !== undefined
        ? draft.poolCompartido.grupos[el.dataset.egroup].evaluaciones[el.dataset.erow]
        : draft.poolCompartido.sueltas[el.dataset.erow];
      target[el.dataset.efield] = el.value;
    };
    if(el.dataset.efield==='notaRaw' && el.dataset.egroup !== undefined){
      el.onblur = ()=> renderModal();
    }
  });
  body.querySelectorAll('[data-dividepond]').forEach(btn=>{
    btn.onclick = ()=>{
      dividirPonderacionIgual(draft.poolCompartido.grupos[btn.dataset.dividepond]);
      renderModal();
    };
  });
  body.querySelectorAll('[data-g]').forEach(el=>{
    const handler = ()=>{
      const g = draft.poolCompartido.grupos[el.dataset.g];
      if(el.dataset.gfield==='eliminarPeorNota') g.eliminarPeorNota = el.checked;
      else if(el.dataset.gfield==='nombre') g.nombre = el.textContent.trim();
      else g.ponderacionGrupo = Number(el.value);
    };
    el.type==='checkbox' ? el.onchange = handler : el.oninput = handler;
    if(el.dataset.gfield==='nombre'){
      el.onkeydown = (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); el.blur(); } };
    }
  });
  body.querySelectorAll('[data-grupoborder]').forEach(block=>{
    block.addEventListener('click', (ev)=>{
      if(ev.target.closest('input, table, button, .grupo-title')) return;
      activeGroupIndex = Number(block.dataset.grupoborder);
      renderModal();
    });
  });

  // Horario
  const addHorarioBtn = document.getElementById('addHorarioBtn');
  if(addHorarioBtn) addHorarioBtn.onclick = ()=>{ draft.horarios.push(nuevoHorario()); renderModal(); };
  body.querySelectorAll('[data-rmhorario]').forEach(btn=>{
    btn.onclick = ()=>{ draft.horarios.splice(btn.dataset.rmhorario,1); renderModal(); };
  });
  body.querySelectorAll('[data-h]').forEach(el=>{
    const handler = ()=>{
      const h = draft.horarios[el.dataset.h];
      if(el.dataset.hfield==='dividirBool'){ h.dividir = el.checked; renderModal(); return; }
      if(el.dataset.hfield==='tipo'){ h.tipo = el.value; renderModal(); return; }
      h[el.dataset.hfield] = el.type==='number' ? Number(el.value) : el.value;
    };
    (el.tagName==='SELECT' || el.type==='checkbox') ? el.onchange = handler : el.oninput = handler;
  });

  // Información
  ['f-nombre','f-codigo','f-profNombre','f-profCorreo','f-coordinacion'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.oninput = ()=>{
      draft.nombre = document.getElementById('f-nombre').value;
      draft.codigo = document.getElementById('f-codigo').value;
      draft.profesorNombre = document.getElementById('f-profNombre').value;
      draft.profesorCorreo = document.getElementById('f-profCorreo').value;
      draft.coordinacion = document.getElementById('f-coordinacion').value;
      document.getElementById('modalTitle').textContent = draft.nombre.trim() || (editingId!==null ? 'Editar ramo' : 'Nuevo ramo');
    };
  });
}

/* ---------- guardar ramo ---------- */
document.getElementById('saveRamoBtn').onclick = ()=>{
  if(!draft.nombre.trim()){
    modalTab = 'info'; activeGroupIndex = null; renderModal();
    showToast('Ponle un nombre al ramo antes de guardar.');
    return;
  }
  if(editingId !== null){
    const idx = ramos.findIndex(r=>r.id===editingId);
    if(idx > -1) ramos[idx] = draft; else ramos.push(draft);
  } else {
    ramos.push(draft);
  }
  editingId = null;
  saveRamos();
  renderRamosList();
  closeRamoModal();
};

/* ---------- lista de ramos ---------- */
function summarizeInfo(r){
  const parts = [];
  if(r.profesorNombre) parts.push(r.profesorNombre);
  if(r.coordinacion) parts.push(r.coordinacion);
  return parts.length ? parts.join(' · ') : 'Sin profesor ni coordinación registrada';
}
function summarizeHorario(r){
  const total = r.horarios.length;
  if(!total) return 'Sin bloques de horario cargados';
  const dias = [...new Set(r.horarios.map(h=>DIAS.find(d=>d.v===h.dia)?.l).filter(Boolean))];
  return `${total} bloque${total>1?'s':''} · ${dias.join(', ')}`;
}
function summarizeEval(r){
  const nS = r.poolCompartido.sueltas.length, nG = r.poolCompartido.grupos.length;
  if(!nS && !nG) return 'Sin evaluaciones cargadas';
  const bits = [];
  if(nG) bits.push(`${nG} grupo${nG>1?'s':''}`);
  if(nS) bits.push(`${nS} suelta${nS>1?'s':''}`);
  return bits.join(' · ');
}
function renderRamosList(){
  const list = document.getElementById('ramosList');
  const frame = document.getElementById('addFrame');
  list.innerHTML = ramos.map(r=>`
    <div class="ramo-card" data-ramoid="${r.id}">
      <div class="ramo-card-header"><h3>${r.nombre}</h3><div class="codigo">${r.codigo || 'sin código'}</div></div>
      <div class="ramo-row"><div class="ramo-row-icon icon-info">${ICON_INFO}</div><div class="ramo-row-text">${summarizeInfo(r)}</div></div>
      <div class="ramo-row"><div class="ramo-row-icon icon-horario">${ICON_HORARIO}</div><div class="ramo-row-text">${summarizeHorario(r)}</div></div>
      <div class="ramo-row"><div class="ramo-row-icon icon-eval">${ICON_EVAL}</div><div class="ramo-row-text">${summarizeEval(r)}</div></div>
      <div class="ramo-card-actions"><button class="icon-btn danger" data-delramo="${r.id}">Eliminar</button></div>
    </div>
  `).join('');
  list.querySelectorAll('.ramo-card').forEach(card=>{
    card.addEventListener('click', (ev)=>{
      if(ev.target.closest('.ramo-card-actions')) return;
      openEditRamo(Number(card.dataset.ramoid));
    });
  });
  list.querySelectorAll('[data-delramo]').forEach(btn=>{
    btn.onclick = (ev)=>{
      ev.stopPropagation();
      ramos = ramos.filter(r=>r.id != btn.dataset.delramo);
      saveRamos();
      renderRamosList();
    };
  });
  frame.className = ramos.length===0 ? 'add-frame big' : 'add-frame compact';
  frame.innerHTML = `<div class="plus">+</div><div class="label">Añadir ramo</div>`;
}

/* ---------- burbuja "Subir horario" ---------- */
document.getElementById('uploadFabBtn').onclick = ()=>{
  if(ramos.length===0){ pendingUploadMode = 'primero'; document.getElementById('pdfInput').click(); }
  else { document.getElementById('choiceBackdrop').classList.add('active'); }
};
document.querySelectorAll('.choice-btn').forEach(btn=>{
  btn.onclick = ()=>{
    pendingUploadMode = btn.dataset.mode;
    document.getElementById('choiceBackdrop').classList.remove('active');
    document.getElementById('pdfInput').click();
  };
});
document.getElementById('choiceCancelBtn').onclick = ()=>{ document.getElementById('choiceBackdrop').classList.remove('active'); };
document.getElementById('pdfInput').onchange = (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  procesarHorarioPDF(file, pendingUploadMode);
  pendingUploadMode = null;
};
function procesarHorarioPDF(file, modo){
  const modoTexto = { primero:'primera carga', reemplazar:'reemplazar', actualizar:'actualizar', agregar:'agregar' }[modo] || modo;
  showToast(`"${file.name}" recibido (modo: ${modoTexto}). El parseo automático del PDF es la próxima pieza — por ahora sigue agregando los ramos con "+ Añadir ramo".`);
}

renderRamosList();
</script>
</body>
</html>
